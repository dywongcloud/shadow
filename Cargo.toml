[workspace]
resolver = "2"
members = [
    "crates/hive-core",
    "crates/hive-backend",
    "crates/hive-controlplane",
    "crates/hive-api",
    "crates/hive-cell-agent",
    "crates/hived",
    "crates/hivectl",
    "crates/fluid-core",
    "crates/fluid-build",
    "crates/fluid-tunnel",
    "crates/fluid-compute",
    "crates/fluid-gateway",
    "crates/fluidd",
    "crates/fluidctl",
    "crates/shadw-cli",
    "crates/hive-p2p",
    "crates/hive-browser-proto",
    "crates/hive-edge",
    "crates/hive-cloud",
    "crates/hive-wg",
    "crates/hive-zkauth",
    "crates/hive-crsql",
]
# vendor/guardian-db carries its own dev-dependencies and is consumed purely as
# a path dependency (see crates/hive-cloud/Cargo.toml) -- excluding it lets its
# own test suite run standalone (`cargo test --manifest-path vendor/guardian-db/Cargo.toml`)
# instead of erroring on the nested-workspace conflict.
# vendor/cr-sqlite is NOT a Cargo path dependency at all -- it's built by its
# own build.sh (own pinned nightly toolchain, see VENDOR.md) into a loadable
# SQLite extension .dylib/.so, loaded at runtime by hive-crsql via rusqlite's
# load_extension. Excluded so its nested core/rs/*/Cargo.toml files (several,
# each its own crate) don't trip the same nested-workspace conflict.
exclude = ["vendor/guardian-db", "crates/hive-browser", "vendor/cr-sqlite"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hive-rs reverse-engineering study"]
repository = "local"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# web / client
axum = { version = "0.7", features = ["macros", "ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# cli
clap = { version = "4", features = ["derive", "env"] }
owo-colors = { version = "4", features = ["supports-colors"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
dashmap = "6"
rand = "0.8"
sha2 = "0.10"
tar = "0.4"

# internal crates
hive-core = { path = "crates/hive-core" }
hive-backend = { path = "crates/hive-backend" }
hive-controlplane = { path = "crates/hive-controlplane" }
hive-api = { path = "crates/hive-api" }
fluid-core = { path = "crates/fluid-core" }
fluid-build = { path = "crates/fluid-build" }
fluid-tunnel = { path = "crates/fluid-tunnel" }
fluid-compute = { path = "crates/fluid-compute" }
fluid-gateway = { path = "crates/fluid-gateway" }
hive-wg = { path = "crates/hive-wg" }
hive-edge = { path = "crates/hive-edge" }
hive-p2p = { path = "crates/hive-p2p" }
hive-browser-proto = { path = "crates/hive-browser-proto" }
hive-crsql = { path = "crates/hive-crsql" }
hive-zkauth = { path = "crates/hive-zkauth" }

# Local fork of guardian-db 0.18.0 (vendor/guardian-db): its Iroh endpoint was
# hardcoded to n0's public relay/discovery preset with no override — from
# networks where n0's relay isn't reliably reachable, that made init hang
# forever (see hive-cloud/src/guardian.rs's GUARDIAN_INIT_TIMEOUT comment for
# the live evidence). The fork honors HIVE_RELAY_URLS, same as hive-p2p, so
# GuardianDB's replication traffic transits the platform's own self-hosted
# relay fleet instead. Re-applied cleanly across the 0.17.2->0.18.0 bump (the
# upstream diff in this region is purely additive — new relay-status/latency
# monitoring methods for the unrelated "sentinel" feature — confirmed via a
# real 3-way diff before merging).
[patch.crates-io]
guardian-db = { path = "vendor/guardian-db" }
iroh-blobs = { path = "vendor/guardian-db/iroh-blobs" }
iroh-docs = { path = "vendor/guardian-db/iroh-docs" }
# iroh #4390: `pending_open_paths` (remote_state.rs) is an unbounded VecDeque
# with no dedup — still unbounded upstream in 1.0.3, both community fix PRs
# closed unmerged. Measured cause of a real production OOM (71,680 MiB, 99.8%
# of live heap, in one stack). vendor/iroh/CHANGES.md documents the exact
# 3-line patch: dedup-on-push + a 256-entry cap. Byte-identical to upstream
# 1.0.2 otherwise — re-diff against the next iroh bump before updating the
# version pin, the same discipline as the guardian-db patch above.
iroh = { path = "vendor/iroh" }

[profile.release]
opt-level = 3
lto = "thin"
# Debug symbols stripped from every release binary — real, measured saving on
# hive-cloud (the largest binary in this workspace, shipped in npm packages):
# 76.0 -> 62.9 MiB (~17%). Backtraces from a release crash already come from
# the panic message + RUST_BACKTRACE, not from symbols in the shipped binary.
strip = true
