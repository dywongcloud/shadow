[package]
name = "hive-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hive-core = { workspace = true, features = ["async-io"] }
fluid-tunnel = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Secure-Enclave-resident per-deployment signing keys (sep_signer.rs). macOS
# only — the SEP has no Linux equivalent this crate targets.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
hex = "0.4"
