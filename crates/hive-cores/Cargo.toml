[package]
name = "hive-cores"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SHADW signed logs (Hypercore cores via shadw-core) stored on a node and pulled over the iroh mesh, stream mode 0x06."

[dependencies]
hive-p2p = { workspace = true }
# Path into vendor/ (excluded from the workspace, like guardian-db); its hypercore
# dependency resolves to the patched vendor/hypercore via [patch.crates-io].
shadw-core = { path = "../../vendor/shadw-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tracing-subscriber = { workspace = true }

[[example]]
name = "core_witness"
path = "examples/core_witness.rs"
