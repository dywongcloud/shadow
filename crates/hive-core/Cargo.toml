[package]
name = "hive-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
# Tamper-evidence hash-chain (integrity.rs) — pure hashing, no async/runtime
# dependency, consistent with this crate's no-runtime rule above.
sha2 = { workspace = true }
hex = "0.4"
# OPTIONAL and off by default: `logcap`'s async reader is generic over the
# `tokio::io::AsyncBufRead` TRAIT only — no runtime, no executor, nothing that
# contradicts this crate's "no async/runtime dependencies" rule for the
# consumers that don't ask for it (`hive-cell-agent` drains its pipes on plain
# OS threads and stays tokio-free here).
tokio = { workspace = true, optional = true }

[features]
default = []
# Enabled by the crates that capture subprocess output on a tokio runtime
# (`hive-backend`, `hive-cloud`).
async-io = ["dep:tokio"]
