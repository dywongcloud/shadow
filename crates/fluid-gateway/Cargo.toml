[package]
name = "fluid-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hive-core = { workspace = true }
hive-backend = { workspace = true }
fluid-core = { workspace = true }
fluid-compute = { workspace = true }
fluid-tunnel = { workspace = true }
bytes = "1"
tokio = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
# Pure-Rust image codecs (no native deps with these features) for the Image
# Optimization endpoint: JPEG/PNG/WebP/GIF decode + JPEG/PNG/WebP encode.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Static-asset compression (Vercel-style): serve a pre-generated `.br`/`.gz`
# sibling when one exists, else compress bounded assets inline.
# Both are pure Rust, no native deps.
brotli = "7"
flate2 = "1"
# Linux openat2(2) gives static-asset reads a kernel-enforced RESOLVE_BENEATH
# boundary. Canonicalize-then-open is TOCTOU-prone when tenant code can mutate
# its checkout concurrently with a request.
libc = "0.2"

[dev-dependencies]
reqwest = { workspace = true }
