[package]
name = "hive-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hive-cloud"
path = "src/main.rs"

[dependencies]
hive-core = { workspace = true }
hive-backend = { workspace = true }
hive-controlplane = { workspace = true }
fluid-core = { workspace = true }
fluid-build = { workspace = true }
fluid-compute = { workspace = true }
fluid-gateway = { workspace = true }
hive-edge = { workspace = true }
hive-wg = { workspace = true }
hive-p2p = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
sha2 = "0.10"
sysinfo = "0.32"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Always-on: iroh-native, P2P-replicated durable store (iroh-docs + iroh-blobs).
# Every platform snapshot is replicated here, in local/dev and production alike.
guardian-db = { version = "0.16" }

# Optional: production-grade Raft consensus (full log + state machine). The
# always-on lightweight coordinator in cluster.rs is the default; `--features
# raft` routes cluster coordination through openraft.
openraft = { version = "0.9", optional = true }

[features]
default = []
raft = ["dep:openraft"]
