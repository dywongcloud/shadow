[package]
name = "hive-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hive-cloud"
path = "src/main.rs"

[dependencies]
hive-core = { workspace = true }
hive-backend = { workspace = true }
hive-controlplane = { workspace = true }
fluid-core = { workspace = true }
fluid-build = { workspace = true }
fluid-compute = { workspace = true }
fluid-gateway = { workspace = true }
fluid-tunnel = { workspace = true }
hive-edge = { workspace = true }
hive-wg = { workspace = true }
hive-p2p = { workspace = true }
hive-browser-proto = { workspace = true }
hive-crsql = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
reqwest = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
uuid = { workspace = true }
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
sha2 = "0.10"
# Memory-hard password KDF for deployment password-protection (replaces the
# brute-forceable sha256(project:password) hash). PHC-string output embeds the
# random salt + params, so a hash computed once on the owner node stays
# verifiable on every peer it's gossiped to.
argon2 = { version = "0.5", features = ["std"] }
sysinfo = "0.32"
# Seer: the platform's own pkarr discovery relay (verify/serve signed node records).
# `signed_packet` only — no DHT/client/network deps. Pinned to iroh's pkarr version.
pkarr = { version = "3.10", default-features = false, features = ["signed_packet"] }
tower = { version = "0.5", features = ["util", "limit"] }
# Connection/request-level DoS bounds on the HTTP listeners: per-request wall
# timeout, request body size cap, and global in-flight concurrency ceiling.
tower-http = { version = "0.6", features = ["timeout", "limit"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
arc-swap = "1"
rustls-pemfile = "2"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Raw-TCP TLS accept for the DB gateway (Postgres/Redis SNI proxy). Matches the
# rustls 0.23 already in the tree (transitive via axum-server); made direct here.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
ring = "0.17"
base64 = "0.22"
# Browser-admission proof-of-possession signature decoding (bn-p2p-heartbeat-
# lease) — already in the tree transitively (iroh/rustls/etc all pull it),
# made direct here for the same reason base64/ring above are.
hex = "0.4"
# MX resolution for the direct-MX SMS fallback (carrier email-to-SMS gateways).
# Already in the tree via iroh; pinned to that version so no new graph pull.
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
serde_cbor = "0.11"
# DB-gateway HTTP REST surface: SQL-over-HTTP for managed Postgres. Real client
# with real parameter binding (extended protocol) — never string interpolation.
# chrono/serde_json/uuid decode features match crates already in the tree.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
# URL-decode for the Upstash-style `GET /<CMD>/<arg>` redis REST path segments.
# Already in the tree transitively (2.3.x); made direct here.
percent-encoding = "2"

# Always-on: iroh-native, P2P-replicated durable store (iroh-docs + iroh-blobs).
# Every platform snapshot is replicated here, in local/dev and production alike.
# `sql` enables guardian-db's native in-process Rust relational/query API
# (guardian_db::sql::open_sql/Session -- zero network hop, NOT the pgwire
# protocol) used for the fleet-consistent relational stores in relational.rs.
guardian-db = { version = "0.18", features = ["sql"] }
# Direct dependency (was transitive via guardian-db/hive-p2p only) so guardian.rs
# can construct iroh::EndpointAddr to seed GuardianDB's known peers from the main
# mesh's own gossip-derived roster. Same "1" range as hive-p2p — cargo unifies
# both to one locked version (confirmed: single "iroh" entry in Cargo.lock).
iroh = "1"
# Embedded iroh-relay server (`iroh_relay::server::Server`): every hived instance
# runs its OWN relay listener in-process (see main.rs's relay-listener boot step)
# instead of depending solely on the standalone `iroh-relay` binaries deployed on
# bkk/va/sj. Only a TRANSITIVE dep of `iroh` otherwise (its `server` module isn't
# re-exported) — pinned to the exact version Cargo.lock already resolves `iroh` to,
# so this doesn't introduce a second resolved version. `server` feature pulls in
# the full in-process listener API (default features `metrics` + `tls-ring` stay
# on too).
iroh-relay = { version = "1.0.2", features = ["server"] }

# Optional: production-grade Raft consensus (full log + state machine). The
# always-on lightweight coordinator in cluster.rs is the default; `--features
# raft` routes cluster coordination through openraft.
openraft = { version = "0.9", optional = true }

# Optional EXPERIMENT: anonymous team/role membership demo endpoints (`zkauth`
# feature). Off by default; mounts /v1/zkauth/* and is not part of real auth.
hive-zkauth = { workspace = true, optional = true }
rust_decimal = { version = "1.42.1", features = ["db-tokio-postgres"] }

[features]
# `zkauth` is DEFAULT-ON: it implements preview-deployment access protection
# (the `#[cfg(feature="zkauth")]` `/_shadw/zk` bootstrap + `cookie_access`
# member-unlock path in edge.rs, and the `/v1/zkauth/*` admin routes). It used
# to be opt-in, which meant a plain `cargo build -p hive-cloud` (used for
# routine fleet rebuilds) silently STRIPPED preview protection's unlock flow
# fleet-wide — a recurring, security-relevant regression. Making it a default
# feature closes that hole at the source: every ordinary build now ships it,
# and there is no longer a build path that omits it by accident. Turn it off
# only deliberately with `--no-default-features` (which no fleet build does).
default = ["zkauth"]
raft = ["dep:openraft"]
zkauth = ["dep:hive-zkauth"]

# Heap profiling, Linux-only (the fleet is Linux; macOS is dev-only and
# jemalloc's profiling support is not available there).
#
# Why this is here at all: the 2026-07 OOM on fc-sanjose -- hive-cloud's own
# RSS grew to ~12.9GB anon before the kernel killed it -- was never
# root-caused, because the binary shipped with the system allocator and had no
# way to answer "which allocation site is growing?" on a live node. Profiling
# is compiled IN but INACTIVE (`prof_active:false`), so steady-state overhead
# is nil; it is switched on at runtime against a node that is actually
# climbing, with no rebuild and no restart.
#
# Deliberately NOT using the `jemalloc_pprof` crate: 0.7.0 resolves two
# incompatible `pprof_util` versions in one graph (0.7.0 for parse_jeheap,
# 0.8.2 via its mappings dep) and fails to compile with a `Mapping` vs
# `pprof_util::Mapping` type error. jemalloc's own `prof.dump` mallctl produces
# the same information in jeprof's native format, analyzable with the `jeprof`
# that ships alongside jemalloc, with one less dependency and no version-skew
# risk in a crate we would only use for formatting.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["use_std"] }
