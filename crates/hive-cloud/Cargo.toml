[package]
name = "hive-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hive-cloud"
path = "src/main.rs"

[dependencies]
hive-core = { workspace = true }
hive-backend = { workspace = true }
hive-controlplane = { workspace = true }
fluid-core = { workspace = true }
fluid-compute = { workspace = true }
fluid-gateway = { workspace = true }
hive-edge = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Optional: iroh-native, P2P-replicated durable store. Enable with
# `--features guardian` (its API is evolving, so kept off the default build).
guardian-db = { version = "0.16", optional = true }

[features]
default = []
guardian = ["dep:guardian-db"]
