[package]
name = "fluid-build"
version.workspace = true
edition.workspace = true
license.workspace = true

# Framework-Defined Infrastructure: detect a project's framework, run its build,
# and normalize the result into the Build Output API v3 — the standard contract
# (static assets + serverless/edge functions + routing) the rest of the platform
# provisions from. Mirrors Vercel's `vercel build` / Build Output API.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# Test-only: the `bun_fixtures` integration test cross-checks a parsed
# `vercel.json`'s runtime string against `hive_core::Runtime`'s own parsing —
# this crate's own production code has no `Runtime` dependency (that
# resolution happens one layer up, in hive-cloud/git.rs, by design).
hive-core = { workspace = true }
