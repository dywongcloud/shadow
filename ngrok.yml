# ngrok config to expose the OpenEdge dashboard AND live deployment URLs at once.
#
# Run (stop any other `ngrok http ...` first — it would clash on shadow.ngrok.pizza):
#   ngrok start --all --config /Users/dylanwong/fluid/hive/ngrok.yml
#
# Two endpoints:
#   1. dashboard — the Next.js UI on :3002        →  https://shadow.ngrok.pizza
#   2. gateway   — the hive-cloud gateway on :8787 →  https://*.deployment.shadow.ngrok.pizza
#
# Deployments route by their SUBDOMAIN (first host label), so
# `https://my-app.deployment.shadow.ngrok.pizza/` hits the gateway and serves the
# `my-app` deployment exactly like `http://my-app.localhost:8787/` does locally.
#
# ⚠ ONE-TIME SETUP — reserve the wildcard domain first (fixes ERR_NGROK_318):
#   https://dashboard.ngrok.com/domains/new   →  enter:  *.deployment.shadow.ngrok.pizza
# Without that reservation ngrok refuses to bind the wildcard endpoint.

version: "3"
agent:
  # authtoken: <your-ngrok-authtoken>   # already configured via `ngrok config add-authtoken`

endpoints:
  - name: dashboard
    url: https://shadow.ngrok.pizza
    upstream:
      url: 3002

  - name: gateway
    url: https://*.deployment.shadow.ngrok.pizza
    upstream:
      url: 8787
