name: Rust CI

# Four BLOCKING test layers on BOTH Linux and macOS: unit
# (cargo test --workspace --locked), integration (per-crate tests + shadw-cli),
# system (real node + real CLI + persistence restart), acceptance
# (scripts/cli-acceptance.sh end to end). No test files are authored here:
# AGENTS.md runs the existing suites and verifies against the real system.
# `contracts` is the gate ASSERTING those four layers are blocking on BOTH
# platforms, pinning each live assertion to the canonical bytes of the
# construct it spends (scripts/contract-bindings.json). A construct that
# changes, moves or is removed fails with the regeneration command; --sync
# never runs in CI.
#
# macOS has no Linux BuildExecutor for isolated repository builds, but the
# REAL host build lane still runs: with the AGENTS.md /private/tmp temp root,
# macOS passes the SAME 35 acceptance assertions as Linux, zero skips. The
# harness probes the host and cross-checks CI's declared platform.
# See docs/ci-contract-bindings.md.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The harness passes an explicit /private/tmp template on macOS (mktemp there
  # ignores TMPDIR); on Linux it uses TMPDIR or /tmp. No workflow-level override.

concurrency:
  group: rust-ci-${{ github.ref }}
  # A pushed SHA auto-deploys through the webhook + git_poll_reconcile. Cancelling
  # its in-flight run would let that SHA reach the fleet with no CI verdict, so
  # only PR updates cancel; push runs always reach a conclusion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: contract bindings + CI gate assertions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      # HEAD^ is needed to check the COMMITTED diff; a depth-1 checkout makes
      # `git diff --check` a no-op against an empty working tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Whitespace (hard gate)
        run: git diff --check HEAD^ HEAD

      # stdlib-only; asserts every layer is blocking on BOTH platforms, refuses
      # an undeclared fail-open, verifies the release workflow is gated, and
      # checks all construct bindings + committed-secret material.
      - name: Contract bindings (hard gate)
        run: python3 -I scripts/check-contract-bindings.py --check

      # A regenerated manifest must ship WITH the construct change in the same
      # commit. Blind --sync laundering (edit + sync with no review) fails here.
      - name: Bindings manifest is committed (hard gate)
        run: git diff --exit-code -- scripts/contract-bindings.json

  test:
    name: build + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = arm64, macos-15-intel = x64. macos-14/macos-13 were
        # retired on 2026-11-02; the old release labels would not boot.
        os: [ubuntu-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Hard gate: the whole workspace must compile and all unit tests pass.
      - name: Build (workspace)
        run: cargo build --workspace --locked --verbose

      - name: Unit tests (workspace)
        run: cargo test --workspace --locked --verbose

      # Declared fail-open in scripts/contract-bindings.json with a reason: the
      # pre-existing style/lint backlog. A NEW admit is refused by `contracts`.
      - name: rustfmt (check)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

  dashboard:
    name: dashboard (types + lint + build) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # A broken lockfile must FAIL: a floating install used to mask it and let
      # CI build against a graph that never matched the committed lockfile.
      # `contracts` refuses that fallback.
      - name: Install (locked)
        working-directory: ui
        run: npm ci

      # Source-only config: .next/dev/types/* are generated by a local `next dev`
      # and are not part of a clean checkout. Typechecking the real source is a
      # hard gate, not a warning.
      - name: Types (source-only)
        working-directory: ui
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build

  security-audit:
    name: security audit (cargo-audit + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Declared fail-open with a reason: the pinned advisory backlog in
      # Cargo.lock. Run with `if: always()` so an install flake cannot silently
      # skip every later check in this job.
      - name: cargo audit (Rust dependencies)
        if: always()
        continue-on-error: true
        run: cargo audit

      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Declared fail-open with a reason: the pinned ui/package-lock.json backlog.
      - name: npm audit (dashboard)
        if: always()
        continue-on-error: true
        working-directory: ui
        run: npm audit --audit-level=high

      # Hard gate, and it actually EXITS NONZERO on a match. The old scan only
      # printed ::warning:: and was itself continue-on-error, so a committed
      # private key produced a green build. PKCS#8 `BEGIN PRIVATE KEY` and
      # assigned fleet-secret literals are covered by contracts' own scan too.
      - name: Committed-secret scan (hard gate)
        if: always()
        run: |
          set -euo pipefail
          found=0
          if git grep -nIE '(^[[:space:]]*-----BEGIN (RSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----[[:space:]]*$|^[[:space:]]*(HIVE_JWT_SECRET|HIVE_SECRET_KEY|HIVE_INTERNAL_TOKEN|HIVE_QUEUE_TOKEN|GITHUB_APP_PRIVATE_KEY)=[^[:space:]"]{16,})' -- . ':(exclude)*.lock' ':(exclude)*.md' ':(exclude)examples/**' ':(exclude)vendor/**' ':(exclude)backups/**'; then
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo "::error::possible committed private key material or literal fleet secret"
            exit 1
          fi
          echo "PASS: no committed private-key material"

  core-tests:
    name: core (deploy + edge + build) tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test deployment model, edge mesh, builds, cloud node
        run: |
          cargo test -p fluid-core --locked
          cargo test -p fluid-build --locked
          cargo test -p hive-edge --locked
          cargo test -p hive-cloud --locked

  cli:
    name: shadw CLI (unit + integration + acceptance) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # All three runners execute the IDENTICAL 35-assertion harness.
          # HIVE_CI_PLATFORM makes the declared runner agree with uname's probe.
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
          - os: macos-15-intel
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: CLI unit + integration tests
        run: |
          cargo test -p shadw-cli --locked --verbose
          cargo test -p hive-cloud --locked --verbose

      - name: clippy (shadw-cli, strict)
        run: cargo clippy -p shadw-cli --all-targets --locked -- -D warnings

      # System + acceptance on ALL THREE runners: a throwaway node on isolated
      # ports with a temp data dir, the REAL compiled CLI, a real deploy,
      # multi-tenant isolation and survival across a node restart. Hermetic:
      # a local file:// repo under /private/tmp on macOS. No platform branch.
      - name: End-to-end acceptance (real node + real CLI)
        env:
          HIVE_CI_PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x scripts/cli-acceptance.sh
          ./scripts/cli-acceptance.sh | tee "$RUNNER_TEMP/acceptance.log"
          grep -qE '35 passed, 0 failed' "$RUNNER_TEMP/acceptance.log"
