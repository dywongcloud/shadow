name: Release npm CLI packages

# Builds shadw (crates/shadw-cli) and shadw-node (crates/hive-cloud, wrapped)
# for every supported platform and publishes them to npm. This is the CI half
# of scripts/build-npm-pkg.sh — the SAME script a local darwin build already
# uses (see that script's own header), run here on real macOS and Linux
# runners for the platforms a single macOS dev machine cannot cross-compile:
# darwin-arm64/x64 were built and locally verified (npm pack + install into a
# scratch prefix + real exec, including actually booting a node and getting
# healthz back) without CI; linux-x64/arm64 need this workflow to exist at all.
#
# Trigger is a dedicated tag namespace (`cli-v*`), not the bare `v*` a lot of
# repos use — this repo's own release cadence for the platform itself must
# never accidentally publish (or skip publishing) npm packages as a side
# effect of an unrelated tag.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            npm_os: darwin
            npm_cpu: arm64
          - os: macos-13
            target: x86_64-apple-darwin
            npm_os: darwin
            npm_cpu: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            npm_os: linux
            npm_cpu: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            npm_os: linux
            npm_cpu: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Both binaries, same script, same shape it already builds locally —
      # see that script's header for why this is the single source of truth.
      - name: Build shadw (crates/shadw-cli)
        run: ./scripts/build-npm-pkg.sh shadw-cli shadw shadw-cli ${{ matrix.target }} ${{ matrix.npm_os }} ${{ matrix.npm_cpu }}

      - name: Build shadw-node (crates/hive-cloud)
        run: ./scripts/build-npm-pkg.sh hive-cloud hive-cloud shadw-node ${{ matrix.target }} ${{ matrix.npm_os }} ${{ matrix.npm_cpu }}

      - uses: actions/upload-artifact@v4
        with:
          name: npm-pkgs-${{ matrix.npm_os }}-${{ matrix.npm_cpu }}
          path: |
            npm/shadw-cli-${{ matrix.npm_os }}-${{ matrix.npm_cpu }}/
            npm/shadw-node-${{ matrix.npm_os }}-${{ matrix.npm_cpu }}/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: npm
          pattern: npm-pkgs-*
          merge-multiple: true

      - name: Verify every platform package got a real binary from the matrix
        run: |
          set -euo pipefail
          for d in npm/shadw-cli-* npm/shadw-node-*; do
            bin="$(node -pe "Object.values(require('./$d/package.json').bin)[0]")"
            test -s "$d/$bin" || { echo "missing/empty binary in $d"; exit 1; }
            chmod +x "$d/$bin"
            echo "ok: $d ($(du -h "$d/$bin" | cut -f1))"
          done

      # optionalDependencies pin an EXACT version (see build-npm-pkg.sh), so
      # platform packages must publish before the dispatchers that depend on
      # them, or a client installing mid-release could get a dispatcher with
      # no matching platform package yet.
      - name: Publish platform packages
        run: |
          for d in npm/shadw-cli-* npm/shadw-node-*; do
            npm publish "$d" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dispatcher packages (shadw, shadw-node)
        run: |
          npm publish npm/shadw --access public
          npm publish npm/shadw-node --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
