# cargo-audit policy for currently unavoidable transitive advisories.
#
# These exceptions are intentionally narrow and temporary. Keep the security
# workflow blocking for every advisory not listed here.
#
# RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml 0.39, DoS-class parser
# issues, fixed in >= 0.41.0): reached only through the Apple-target-only
# chain iroh -> netwatch -> netdev -> plist -> quick-xml; the code is not
# compiled on Linux CI targets. No plist release admits quick-xml >= 0.41 yet
# (plist 1.9.0 pins ^0.39.2). Remove when plist updates its quick-xml
# dependency and the chain can be bumped via `cargo update`. Mirrors the
# identical, already-accepted exception in vendor/guardian-db/.cargo/audit.toml
# (that sub-crate pulls the same chain independently, with its own lockfile).
[advisories]
ignore = [
    # quick-xml: Apple-only transitive dependency through plist.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # Temporarily accepted unmaintained transitive crates.
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0196", # cgmath
    "RUSTSEC-2026-0173", # proc-macro-error2
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2022-0104", # structopt
]
