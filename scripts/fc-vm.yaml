# Lima VM for running REAL Firecracker microVMs on Apple Silicon (nested virtualization via vz: M3+, macOS 15+, Lima >= 1.0).
vmType: "vz"
nestedVirtualization: true
arch: "aarch64"
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
cpus: 6
memory: "8GiB"
disk: "40GiB"
mountType: "virtiofs"
mounts:
  - location: "/Users/dylanwong/fluid/hive"
    mountPoint: "/hive"
    writable: true
