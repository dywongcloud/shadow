<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>shadw headless browser node</title>
</head>
<body>
<pre id="log">booting…</pre>
<script type="module">
/* Headless host page for the fleet-run browser node (role `hive_browser_node` copies this single source to the node):
 * a dedicated-Worker client of the shipped /run-node-worker.js, with the session minted by the node-local broker. */

const log = (msg) => {
  const line = `${new Date().toISOString()} ${msg}`;
  document.getElementById("log").textContent = line;
  console.log(line);
};

const BACKEND_PRESENCE_TTL_MS = 90_000;
const PRESENCE_REFRESH_MS = BACKEND_PRESENCE_TTL_MS / 2;
const BROKER_HEARTBEAT_MS = 15_000;
const REMINT_MS = 120_000;
const ASSERT_FOREGROUND_MS = 30_000;
const SESSION_EXPIRED_STATUS = 401;

let status = { lifecycle: "stopped", admission: "none", endpointId: null, relay: null, serving: false, lastError: null };
let presenceOk = false;

function presenceState(lifecycle) {
  if (lifecycle === "starting") return "starting";
  if (lifecycle === "online") return "online";
  if (lifecycle === "degraded" || lifecycle === "error") return "degraded";
  if (lifecycle === "suspended") return "suspended";
  return null;
}

/** The ONE 2FA prompt for this host page. A DOM input keeps the challenge id and the
 *  code in this call chain only: never a URL, query, Location, attribute, storage or log line.
 *  `otp` carries a 6-digit TOTP OR a one-use recovery code (both verified by the backend). */
const OTP_PROMPT_TIMEOUT_MS = 5 * 60_000;
let otpPromptInFlight = null;
function askOtp(error) {
  if (otpPromptInFlight) return otpPromptInFlight;
  let box = document.getElementById("otp-box");
  if (!box) {
    box = document.createElement("div");
    box.id = "otp-box";
    const label = document.createElement("label");
    label.textContent = "Two-factor code (6 digits or recovery code): ";
    const input = document.createElement("input");
    input.type = "password";
    input.autocomplete = "one-time-code";
    input.inputMode = "text";
    input.maxLength = 64;
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "Verify";
    const note = document.createElement("span");
    box.append(label, input, button, note);
    document.body.append(box);
  }
  const input = box.querySelector("input");
  const button = box.querySelector("button");
  const note = box.querySelector("span");
  note.textContent = error || "";
  input.value = "";
  box.hidden = false;
  input.focus();
  otpPromptInFlight = new Promise((resolve) => {
    let timer = null;
    const done = (code) => {
      if (timer !== null) clearTimeout(timer);
      input.removeEventListener("keydown", onKey);
      button.removeEventListener("click", onClick);
      box.hidden = true;
      otpPromptInFlight = null;
      resolve(String(code || "").trim());
    };
    const onClick = () => done(input.value);
    const onKey = (ev) => { if (ev.key === "Enter") done(input.value); };
    timer = setTimeout(() => done(""), OTP_PROMPT_TIMEOUT_MS);
    input.addEventListener("keydown", onKey);
    button.addEventListener("click", onClick);
  });
  return otpPromptInFlight;
}

function otpChallengeId(d) {
  if (!d || d.otp_required !== true || typeof d.challenge_id !== "string") return "";
  return d.challenge_id.trim();
}

async function mint(team) {
  const body = { team };
  try {
    let r = await fetch("/api/token", {
      method: "POST",
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    let error = "";
    for (;;) {
      if (r.ok) return true;
      const d = await r.json().catch(() => null);
      const challengeId = otpChallengeId(d);
      if (!challengeId) return false;
      const otp = await askOtp(error);
      if (!otp) return false;
      r = await fetch("/api/token", {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ ...body, challenge_id: challengeId, otp }),
      });
      error = "That code was not accepted. Enter a new code or a recovery code.";
    }
  } catch {
    return false;
  }
}

async function refreshGeoWhileUnlocated(cfg) {
  if (cfg.lat !== null && cfg.lon !== null) return;
  try {
    const fresh = await (await fetch("/config", { cache: "no-store" })).json();
    if (fresh.lat !== null && fresh.lon !== null) {
      cfg.lat = fresh.lat;
      cfg.lon = fresh.lon;
      log(`geo resolved (${fresh.geoSource}) lat=${fresh.lat} lon=${fresh.lon}`);
    }
  } catch {
    /* retried next tick */
  }
}

async function publishPresence(cfg) {
  const state = presenceState(status.lifecycle);
  if (!status.endpointId || !state) {
    presenceOk = false;
    return;
  }
  await refreshGeoWhileUnlocated(cfg);
  try {
    const r = await fetch("/cloud/v1/browser/presence", {
      method: "POST",
      credentials: "same-origin",
      headers: { "content-type": "application/json", "x-hive-team": cfg.team },
      body: JSON.stringify({
        endpoint_id: status.endpointId,
        lat: cfg.lat,
        lon: cfg.lon,
        relay_hint: status.relay || "",
        state,
      }),
    });
    if (r.status === SESSION_EXPIRED_STATUS) {
      await mint(cfg.team);
      presenceOk = false;
      return;
    }
    presenceOk = r.ok;
  } catch {
    presenceOk = false;
  }
}

async function heartbeat() {
  try {
    await fetch("/heartbeat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ ...status, presenceOk }),
    });
  } catch {
    /* the broker's own staleness detector is the backstop */
  }
}

function answerDbWorkerRequestDefensively(worker, requestId) {
  try {
    const w = new Worker("/browser-node/sqlite/sqlite-worker.js", { type: "module" });
    const chan = new MessageChannel();
    chan.port1.onmessage = (ev) => w.postMessage(ev.data);
    w.onmessage = (ev) => chan.port1.postMessage(ev.data);
    worker.postMessage({ type: "dbWorkerPort", requestId }, [chan.port2]);
  } catch {
    /* the worker's own timeout surfaces an honest status.db error */
  }
}

async function main() {
  const cfg = await (await fetch("/config", { cache: "no-store" })).json();
  log(`config team=${cfg.team} scope=${cfg.scope} serveMode=${cfg.serveMode} abi=${cfg.abi}`);

  const mintedBeforeFirstAdmission = await mint(cfg.team);
  if (!mintedBeforeFirstAdmission) log("initial mint failed — the worker's own re-mint will retry");

  const worker = new Worker(`/run-node-worker.js?abi=${cfg.abi}`, { type: "module" });
  worker.onerror = (e) => log(`worker error: ${e && e.message ? e.message : "unknown"}`);
  worker.onmessage = (e) => {
    const msg = e.data;
    if (msg && msg.type === "status") {
      status = msg.status;
      log(`lifecycle=${status.lifecycle} admission=${status.admission} serving=${!!status.serving} endpoint=${(status.endpointId || "").slice(0, 12)} ${status.lastError ? "err=" + status.lastError : ""}`);
    } else if (msg && msg.type === "dbWorkerRequest") {
      answerDbWorkerRequestDefensively(worker, msg.requestId);
    }
  };

  const assertForeground = () => worker.postMessage({ type: "visibility", visible: true });
  assertForeground();
  worker.postMessage({ type: "network", online: true });

  worker.postMessage({
    type: "start",
    relay: cfg.relay,
    deployment: cfg.deployment || "",
    fn: cfg.fn || "",
    digest: "",
    serveMode: cfg.serveMode,
    scope: cfg.scope,
    team: cfg.team,
  });

  setInterval(assertForeground, ASSERT_FOREGROUND_MS);
  setInterval(() => mint(cfg.team), REMINT_MS);
  setInterval(() => publishPresence(cfg), PRESENCE_REFRESH_MS);
  setInterval(heartbeat, BROKER_HEARTBEAT_MS);
  publishPresence(cfg);
  heartbeat();
}

main().catch((e) => log(`fatal: ${e && e.message ? e.message : e}`));
</script>
</body>
</html>
