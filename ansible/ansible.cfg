[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# Kernel builds (pvm_firecracker) and cargo builds (hive_platform) are
# long-running; keep the control connection alive rather than timing out.
timeout = 60
vault_password_file = .vault_pass
# .vault_pass is gitignored and never committed -- see roles/README's Secrets
# section. Ansible only reads this file when it exists; its absence just
# means vault-encrypted vars fail with a clear error instead of silently
# using a stale password.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120m -o ServerAliveInterval=30 -o ServerAliveCountMax=120
