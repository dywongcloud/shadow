[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# Kernel builds (pvm_firecracker) and cargo builds (hive_platform) are
# long-running; keep the control connection alive rather than timing out.
timeout = 60
vault_password_file = .vault_pass
# The fleet is 14 hosts today (2 fc_kvm + 9 fc_pvm + 3 fc_gpu). Ansible's own
# default (5) silently re-serializes any play that has no `serial:` -- a
# "parallel" push play targeting `hosts: platform` would still only run 5
# hosts at a time by default, batching what playbooks/parallel-deploy.yml's
# comments promise is a single parallel fan-out. Sized with headroom above
# the current fleet so adding a node doesn't quietly reintroduce batching;
# `serial:`/`throttle:` on individual plays/tasks are the REAL bound on
# restart concurrency and heavy-transfer concurrency, not this ceiling.
forks = 20
# .vault_pass is gitignored and never committed -- see roles/README's Secrets
# section. Ansible only reads this file when it exists; its absence just
# means vault-encrypted vars fail with a clear error instead of silently
# using a stale password.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120m -o ServerAliveInterval=30 -o ServerAliveCountMax=120
