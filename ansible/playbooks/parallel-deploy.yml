---
# Fleet-wide deploy of the hive-cloud backend and the ui/ dashboard (replaces scripts/roll-backend-fleet.sh
# + scripts/deploy-ui-fleet.sh); the plays below are build, push, serial restart and content verification.
#
# Usage:
#   ansible-playbook playbooks/parallel-deploy.yml
#   ansible-playbook playbooks/parallel-deploy.yml -e deploy_serial_ui=2        # UI restart batch size
#   ansible-playbook playbooks/parallel-deploy.yml -e deploy_serial_backend=2   # raise only with real quorum-safety evidence
#   ansible-playbook playbooks/parallel-deploy.yml -e deploy_serial=2          # legacy: sets both unless the specific vars are given
#   ansible-playbook playbooks/parallel-deploy.yml -e hive_push_throttle=8     # more concurrent big-artifact pushes
#   ansible-playbook playbooks/parallel-deploy.yml --tags backend | --tags ui
#   ansible-playbook playbooks/parallel-deploy.yml --limit fc_pvm       # MUST also include each represented glibc group's BUILD host
#   ansible-playbook playbooks/parallel-deploy.yml -e allow_noop_deploy=true   # permit a run that changes no host's binary

- name: Elect build hosts and stage the shared artifact directory
  hosts: platform
  gather_facts: false
  tags: [always]
  tasks:
    - name: Elect the first host of each glibc group as its build host
      ansible.builtin.group_by:
        key: "{{ 'glibc239_builder' if inventory_hostname == groups['glibc239'][0] else ('glibc238_builder' if inventory_hostname == groups['glibc238'][0] else 'glibc_follower') }}"

    - name: Assert each represented glibc group's build host is in this run
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.assert:
        that:
          - (ansible_play_hosts_all | intersect(groups['glibc239'] | default([])) | length == 0)
            or (groups['glibc239'][0] in ansible_play_hosts_all)
          - (ansible_play_hosts_all | intersect(groups['glibc238'] | default([])) | length == 0)
            or (groups['glibc238'][0] in ansible_play_hosts_all)
        fail_msg: >-
          This run includes hosts from a glibc group without that group's BUILD
          host, so nothing would be built for them and the push would fail later
          with an opaque controller-path error. Add the builder to --limit:
          glibc239 builds on '{{ groups['glibc239'][0] | default('?') }}',
          glibc238 builds on '{{ groups['glibc238'][0] | default('?') }}'.
          This run has: {{ ansible_play_hosts_all | join(',') }}.
        success_msg: "build hosts present for every represented glibc group"

    - name: Elect the control-plane leader as the UI build host
      ansible.builtin.group_by:
        key: "{{ 'ui_builder' if hive_name == hive_cp_owner_chain.split(',')[0] else 'ui_follower' }}"

    - name: Create a scratch dir on the control host for fetched artifacts
      ansible.builtin.tempfile:
        state: directory
        prefix: hive-parallel-deploy-
      delegate_to: localhost
      delegate_facts: true
      connection: local
      run_once: true
      register: _artifact_tmp

    - name: Publish the artifact root to every host's facts
      ansible.builtin.set_fact:
        hive_artifact_root: "{{ _artifact_tmp.path }}"

    - name: Stamp this run's start time on every host
      ansible.builtin.command: date +%s
      changed_when: false
      register: _deploy_epoch

    - name: Publish the deploy epoch
      ansible.builtin.set_fact:
        hive_deploy_epoch: "{{ _deploy_epoch.stdout | int }}"

- name: Backend build (parallel, one host per glibc group)
  hosts: glibc239_builder:glibc238_builder
  become: true
  strategy: free
  tags: [backend]
  vars:
    hive_glibc_group: "{{ 'glibc239' if inventory_hostname in groups['glibc239'] else 'glibc238' }}"
  tasks:
    - name: Announce this host's build role
      ansible.builtin.debug:
        msg: "{{ hive_name }}: elected build host for {{ hive_glibc_group }}"
    - ansible.builtin.include_role:
        name: hive_platform_fanout
        tasks_from: build

- name: Backend push (parallel, all platform hosts)
  hosts: platform
  become: true
  strategy: free
  tags: [backend]
  vars:
    hive_glibc_group: "{{ 'glibc239' if inventory_hostname in groups['glibc239'] else 'glibc238' }}"
    hive_group_build_host: "{{ groups['glibc239'][0] if hive_glibc_group == 'glibc239' else groups['glibc238'][0] }}"
  tasks:
    - ansible.builtin.include_role:
        name: hive_platform_fanout
        tasks_from: push

- name: Backend restart (serial -- mesh quorum safety)
  hosts: platform
  become: true
  serial: "{{ deploy_serial_backend | default(deploy_serial | default(1)) }}"
  tags: [backend]
  vars:
    hive_glibc_group: "{{ 'glibc239' if inventory_hostname in groups['glibc239'] else 'glibc238' }}"
    hive_group_build_host: "{{ groups['glibc239'][0] if hive_glibc_group == 'glibc239' else groups['glibc238'][0] }}"
  tasks:
    - ansible.builtin.include_role:
        name: hive_platform_fanout
        tasks_from: restart

- name: Backend verification (artifact CONTENT, every host)
  hosts: platform
  become: true
  any_errors_fatal: true
  tags: [backend]
  vars:
    hive_glibc_group: "{{ 'glibc239' if inventory_hostname in groups['glibc239'] else 'glibc238' }}"
    hive_group_build_host: "{{ groups['glibc239'][0] if hive_glibc_group == 'glibc239' else groups['glibc238'][0] }}"
  tasks:
    - ansible.builtin.include_role:
        name: hive_platform_fanout
        tasks_from: verify

    - name: Fleet backend verification summary
      vars:
        _v: "{{ ansible_play_hosts | map('extract', hostvars, 'hive_verify_backend') | select('defined') | list }}"
        _changed: "{{ ansible_play_hosts | map('extract', hostvars, 'hive_verify_backend') | select('defined')
                      | selectattr('content_changed', 'equalto', 'yes') | list }}"
      ansible.builtin.debug:
        msg:
          - "BACKEND VERIFIED: {{ _v | length }}/{{ ansible_play_hosts | length }} hosts run the controller and install the cell agent built in this run"
          - "controller or agent content changed on {{ _changed | length }} host(s): {{ _changed | map(attribute='host') | join(', ') if _changed else '(none)' }}"
          - "controllers: {{ _v | map(attribute='canonical_sha') | unique | map('truncate', 12, true, '') | join(', ') }}"
          - "cell agents: {{ _v | map(attribute='canonical_agent_sha') | unique | map('truncate', 12, true, '') | join(', ') }}"
      run_once: true
      delegate_to: localhost
      become: false

    - name: Refuse a deploy that changed nothing (no-op detector)
      vars:
        _v: "{{ ansible_play_hosts | map('extract', hostvars, 'hive_verify_backend') | select('defined') | list }}"
        _changed: "{{ ansible_play_hosts | map('extract', hostvars, 'hive_verify_backend') | select('defined')
                      | selectattr('content_changed', 'equalto', 'yes') | list }}"
      ansible.builtin.assert:
        that:
          - (_v | length) == (ansible_play_hosts | length)
          - (_changed | length) > 0 or (allow_noop_deploy | default(false) | bool)
        fail_msg: >-
          {% if (_v | length) != (ansible_play_hosts | length) %}
          Only {{ _v | length }} of {{ ansible_play_hosts | length }} hosts produced
          verification facts -- the rest were never verified, so this run's result is unknown.
          {% else %}
          NO-OP DEPLOY: every host already had the exact controller+cell-agent
          pair this run built ({{ _v[0].canonical_sha[:12] }} +
          {{ _v[0].canonical_agent_sha[:12] }}), so nothing was deployed. Either the source
          never changed, or the build host rebuilt nothing (check that your --limit
          includes the right builder and that crates/ actually synced). Re-run with
          -e allow_noop_deploy=true if a no-op was the intent.
          {% endif %}
        success_msg: >-
          {{ _changed | length }}/{{ ansible_play_hosts | length }} hosts took new controller or cell-agent content;
          all {{ _v | length }} verified against the release pair built this run.
      run_once: true
      delegate_to: localhost
      become: false

- name: Re-kick the earliest-restarted nodes (trunks re-form against the settled fleet)
  hosts: "{{ groups['platform'][0:3] | join(':') }}"
  serial: 1
  become: true
  tags: [backend]
  tasks:
    - name: Let the fleet settle before the re-kick
      ansible.builtin.pause:
        seconds: 45
      run_once: true

    - name: Restart hive-node once more
      ansible.builtin.systemd:
        name: hive-node
        state: restarted

    - name: Wait for mesh re-convergence after the re-kick
      ansible.builtin.uri:
        url: "http://127.0.0.1:8786/v1/mesh"
        return_content: true
      register: rekick_mesh
      retries: 18
      delay: 10
      until: >-
        rekick_mesh.status == 200 and
        (rekick_mesh.json.visible_healthy_peers | int) >=
        ([((rekick_mesh.json.expected_peers | int) / 4) | round(0, 'ceil') | int, 3] | max)

    - name: Re-kick convergence summary
      ansible.builtin.debug:
        msg: "re-kicked {{ inventory_hostname }}: {{ rekick_mesh.json.visible_healthy_peers }}/{{ rekick_mesh.json.expected_peers }} visible healthy peers"

- name: UI build (once, on the control-plane leader)
  hosts: ui_builder
  become: true
  strategy: free
  tags: [ui]
  tasks:
    - name: Announce this host's build role
      ansible.builtin.debug:
        msg: "{{ hive_name }}: elected UI build host (control-plane leader)"
    - ansible.builtin.include_role:
        name: hive_ui_fanout
        tasks_from: build

- name: UI push (parallel, all platform hosts)
  hosts: platform
  become: true
  strategy: free
  tags: [ui]
  vars:
    hive_ui_build_host: "{{ groups['ui_builder'][0] }}"
  tasks:
    - ansible.builtin.include_role:
        name: hive_ui_fanout
        tasks_from: push

- name: UI restart (serial -- dashboard never down fleet-wide)
  hosts: platform
  become: true
  serial: "{{ deploy_serial_ui | default(deploy_serial | default(3)) }}"
  tags: [ui]
  vars:
    hive_ui_build_host: "{{ groups['ui_builder'][0] }}"
    hive_canon_build_id: "{{ hostvars[groups['ui_builder'][0]].hive_canon_build_id | default('') }}"
  tasks:
    - ansible.builtin.include_role:
        name: hive_ui_fanout
        tasks_from: restart

- name: UI verification (bundle CONTENT, every host)
  hosts: platform
  become: true
  any_errors_fatal: true
  tags: [ui]
  vars:
    hive_ui_build_host: "{{ groups['ui_builder'][0] }}"
  tasks:
    - ansible.builtin.include_role:
        name: hive_ui_fanout
        tasks_from: verify

    - name: Fleet UI verification summary
      vars:
        _v: "{{ ansible_play_hosts | map('extract', hostvars, 'hive_verify_ui') | select('defined') | list }}"
      ansible.builtin.debug:
        msg: >-
          UI VERIFIED: {{ _v | length }}/{{ ansible_play_hosts | length }} hosts serving
          BUILD_ID {{ _v | map(attribute='build_id') | unique | join(', ') }}
          (canonical {{ _v[0].canonical_build_id | default('?') }})
      run_once: true
      delegate_to: localhost
      become: false

    - name: Assert every host was UI-verified
      vars:
        _v: "{{ ansible_play_hosts | map('extract', hostvars, 'hive_verify_ui') | select('defined') | list }}"
      ansible.builtin.assert:
        that:
          - (_v | length) == (ansible_play_hosts | length)
          - (_v | map(attribute='build_id') | unique | list | length) == 1
        fail_msg: >-
          UI deploy unverified: {{ _v | length }}/{{ ansible_play_hosts | length }} hosts
          reported, build ids {{ _v | map(attribute='build_id') | unique | join(', ') }}.
          More than one BUILD_ID behind one round-robin hostname is the "mobile endless
          flicker" incident.
      run_once: true
      delegate_to: localhost
      become: false

- name: Clean up the control host's scratch artifact directory
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - ansible.builtin.file:
        path: "{{ _root }}"
        state: absent
      vars:
        _root: "{{ hostvars[groups['platform'][0]]['hive_artifact_root'] | default('') }}"
      when: _root | length > 0
      run_once: true
