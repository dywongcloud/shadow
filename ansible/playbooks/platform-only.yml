---
# Fast path: rebuild and install the hive-cloud controller plus its exact
# hive-cell-agent companion fleet-wide, skipping Firecracker/kernel/DNS work.
# The guest agent is published on the host here but is NOT baked automatically;
# a later explicitly drained hive_platform_rootfs run owns that migration.
#
# One host at a time so mesh quorum is never lost across more than one node.
#
# Usage:
#   ansible-playbook playbooks/platform-only.yml
#   ansible-playbook playbooks/platform-only.yml --limit fc_pvm
- name: Redeploy the hive controller + cell-agent release pair
  hosts: platform
  become: true
  serial: 1
  roles:
    - role: hive_platform
