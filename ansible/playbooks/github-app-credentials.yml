---
# Credential-only: reconciles the GitHub App credentials one host at a time, with a /v1/mesh health wait after each; never syncs source or builds/swaps a binary.
# Usage (canary first, then the rest):
#   ansible-playbook -i inventory/hosts.ini playbooks/github-app-credentials.yml --limit sj
#   ansible-playbook -i inventory/hosts.ini playbooks/github-app-credentials.yml --limit 'platform:!sj'

- name: Reconcile hive-cloud GitHub App credentials only
  hosts: platform
  become: true
  serial: 1
  tasks:
    - name: Run the shared GitHub App credential reconciler
      ansible.builtin.include_role:
        name: hive_platform
        tasks_from: github_app_credentials
        apply:
          tags:
            - github_app_credentials
      tags:
        - github_app_credentials

    - name: Apply credential changes before checking this serial host
      ansible.builtin.meta: flush_handlers
      tags:
        - github_app_credentials

    - name: Wait for hive-node after credential reconciliation
      ansible.builtin.uri:
        url: "http://{{ hive_admin }}/v1/mesh"
        method: GET
        status_code: 200
      register: _github_app_mesh
      retries: 12
      delay: 5
      until: _github_app_mesh.status == 200
      tags:
        - github_app_credentials
