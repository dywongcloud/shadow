---
# Credential-only future rollout. This play never syncs source and never builds
# or swaps a binary. Do not run it until the private-repository poller-capable
# hive-cloud binary is already present on the intended canary.
#
# Serial canary procedure (prepared only; do not execute in this change):
#   1. ansible-playbook -i inventory/hosts.ini playbooks/github-app-credentials.yml --limit sj
#   2. Confirm only path/names and modes, never values:
#      ansible -i inventory/hosts.ini sj -b -m shell -a "stat -c '%U:%G %a %n' /etc/hive-github-app.env /etc/systemd/system/hive-node.service.d/github-app.conf; systemctl show hive-node -p EnvironmentFiles; tr '\0' '\n' < /proc/$(systemctl show -p MainPID --value hive-node)/environ | cut -d= -f1 | grep '^GITHUB_APP_'"
#   3. Hold on sj for at least two git-poll cadences and require no new
#      had_token=false line. Advance a private repository's remote HEAD and
#      require the poll build to complete. Trigger a protected webhook preview
#      and require Ready plus HTTP 200 at its self-alias.
#   4. Only after all three witnesses pass, continue serially:
#      ansible-playbook -i inventory/hosts.ini playbooks/github-app-credentials.yml --limit 'platform:!sj'

- name: Reconcile hive-cloud GitHub App credentials only
  hosts: platform
  become: true
  serial: 1
  tasks:
    - name: Run the shared GitHub App credential reconciler
      ansible.builtin.include_role:
        name: hive_platform
        tasks_from: github_app_credentials
        apply:
          tags:
            - github_app_credentials
      tags:
        - github_app_credentials

    - name: Apply credential changes before checking this serial host
      ansible.builtin.meta: flush_handlers
      tags:
        - github_app_credentials

    - name: Wait for hive-node after credential reconciliation
      ansible.builtin.uri:
        url: "http://{{ hive_admin }}/v1/mesh"
        method: GET
        status_code: 200
      register: _github_app_mesh
      retries: 12
      delay: 5
      until: _github_app_mesh.status == 200
      tags:
        - github_app_credentials
