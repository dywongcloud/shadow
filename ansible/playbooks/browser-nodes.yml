---
# One headless browser node per host in [browser_nodes] (roles/hive_browser_node; its README documents the auth decision and every cap value).
#
# Usage:
#   ansible-playbook playbooks/browser-nodes.yml                       # every host in [browser_nodes]
#   ansible-playbook playbooks/browser-nodes.yml --limit <host>        # one host
#   ansible-playbook playbooks/browser-nodes.yml --syntax-check        # local only, no connections
#   ansible-playbook playbooks/browser-nodes.yml -e hive_browser_node_team=acme
#   ansible-playbook playbooks/browser-nodes.yml --tags verify         # re-verify only
# --check is not a dry run here (the verify tasks poll a broker that check mode never started): use --limit on one host.
#
# Rollback (keeps the profile/identity, so a re-enable keeps the same endpoint id):
#   ansible browser_nodes -m systemd -a 'name=hive-browser-node state=stopped enabled=false'
#   ansible browser_nodes -m systemd -a 'name=hive-browser-node-broker state=stopped enabled=false'

- name: Preflight — the browser-node roster is exactly the six intended hosts
  hosts: browser_nodes
  gather_facts: false
  run_once: true
  tags: [always]
  tasks:
    - name: Assert the group resolves to exactly the six expected nodes
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - (groups['browser_nodes'] | length) == 6
          - (groups['browser_nodes'] | map('extract', hostvars, 'hive_name') | sort)
            == ['fc-bangkok', 'fc-frankfurt', 'fc-hongkong', 'fc-sanjose',
                'fc-saopaulo', 'fc-virginia']
        fail_msg: >-
          [browser_nodes] resolved to
          {{ groups['browser_nodes'] | map('extract', hostvars, 'hive_name') | list }} —
          expected exactly fc-bangkok, fc-sanjose, fc-virginia, fc-saopaulo,
          fc-frankfurt, fc-hongkong, one each. Fix inventory/hosts.ini, not this assert.
        success_msg: "browser-node roster verified: 6 hosts, one per node."

- name: Headless browser node (capped, unattended)
  hosts: browser_nodes
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: hive_browser_node
      tags: [hive_browser_node, browser_node]

- name: Verify — every browser node is admitted and visible in presence
  hosts: browser_nodes
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Read this node's broker health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hive_browser_node_port }}/healthz"
        return_content: true
        status_code: [200, 503]
      register: bn_health

    - name: Summarize
      ansible.builtin.debug:
        msg: >-
          {{ hive_name }} ok={{ bn_health.json.ok }}
          lifecycle={{ bn_health.json.lifecycle }}
          admission={{ bn_health.json.admission }}
          serving={{ bn_health.json.serving }}
          endpoint={{ (bn_health.json.endpoint_id | default('')) [:16] }}
          relay={{ bn_health.json.relay }}
          presence_age_ms={{ bn_health.json.presence_age_ms }}
          geo={{ bn_health.json.geo_source | default('?') }}

    - name: Ask the fleet for this tenant's browser presence
      ansible.builtin.shell: |
        set -euo pipefail
        jar=$(mktemp)
        trap 'rm -f "$jar"' EXIT
        base="http://127.0.0.1:{{ hive_browser_node_port }}"
        curl -fsS -c "$jar" -X POST "$base/api/token" -H 'content-type: application/json' -d '{}' >/dev/null
        curl -fsS -b "$jar" "$base/cloud/v1/browser/presence"
      args:
        executable: /bin/bash
      register: bn_presence
      changed_when: false
      retries: 12
      delay: 10
      until: (bn_health.json.endpoint_id | default('')) in (bn_presence.stdout | default(''))
      failed_when: false

    - name: Assert this node's endpoint appears in fleet presence
      ansible.builtin.assert:
        that: bn_health.json.endpoint_id | default('') in bn_presence.stdout
        fail_msg: >-
          {{ hive_name }}'s endpoint {{ bn_health.json.endpoint_id | default('(none)') }}
          is NOT in the fleet's browser presence list for team
          {{ hive_browser_node_team }}. The node is running but the platform
          cannot see it — check `journalctl -u hive-browser-node -n 100` and the
          admission errors in /healthz's last_error.
        success_msg: "{{ hive_name }}: live in fleet browser presence."
