---
# End-to-end fleet deployment: prerequisites -> Firecracker (KVM or PVM, per inventory group) -> hive-cloud binary ->
# Litebox -> dashboard UI -> mesh trust -> DNS/TLS ingress.
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit fc_pvm         # one flavor only
#   ansible-playbook playbooks/site.yml --tags hive_platform   # redeploy code only (see also playbooks/platform-only.yml)
#   ansible-playbook playbooks/site.yml --tags pvm_firecracker -e pvm_reboot=false

- name: Base OS prerequisites
  hosts: platform
  become: true
  gather_facts: true
  roles:
    - role: prerequisites
      tags: [prerequisites]
    - role: fail2ban
      tags: [fail2ban]

- name: Firecracker (real hardware KVM)
  hosts: fc_kvm
  become: true
  roles:
    - role: firecracker_kvm
      tags: [firecracker, firecracker_kvm]

- name: Firecracker (PVM, no hardware KVM)
  hosts: fc_pvm
  become: true
  serial: 1
  roles:
    - role: pvm_firecracker
      tags: [firecracker, pvm_firecracker]

- name: hive-cloud platform binary + service
  hosts: platform
  become: true
  roles:
    - role: hive_platform
      tags: [hive_platform, platform]

- name: Litebox syscall-sandbox backend (nodes where no microVM path is safe)
  hosts: litebox
  become: true
  roles:
    - role: litebox
      tags: [litebox]

- name: Platform dashboard UI (Next.js on loopback :3002)
  hosts: platform
  become: true
  roles:
    - role: hive_ui
      tags: [hive_ui, ui]

- name: Mesh trust configuration
  hosts: platform
  become: true
  roles:
    - role: mesh_bootstrap
      tags: [mesh_bootstrap, mesh]

- name: DNS / TLS ingress (Vercel)
  hosts: platform
  become: true
  roles:
    - role: dns_vercel
      tags: [dns_vercel, dns]
