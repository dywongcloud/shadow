---
- name: Stop the serialized root-flock holder
  ansible.builtin.systemd:
    name: "{{ _build_executor_lock_unit }}"
    state: stopped

- name: Mark this invocation's lock released after holder exit
  ansible.builtin.set_fact:
    _build_executor_lock_held: false

- name: Remove the lock-holder receipt
  ansible.builtin.file:
    path: "{{ _build_executor_lock_ready }}"
    state: absent

- name: Prove this invocation's lock holder is inactive
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-active
      - "{{ _build_executor_lock_unit }}"
  register: _build_executor_lock_unit_active
  changed_when: false
  failed_when: _build_executor_lock_unit_active.rc == 0
