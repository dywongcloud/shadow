---
# Pinned litebox commit (microsoft/litebox). Bump deliberately, re-diff
# against the module doc's security-posture claims in
# crates/hive-backend/src/litebox.rs, and re-verify with --litebox-probe
# before rolling — litebox's own Provider-trait surface is still under
# active churn upstream (see the litebox-api research this role's commit
# was grounded on).
litebox_repo_url: "https://github.com/microsoft/litebox"
litebox_commit: "e7984422ce1aab181305ac7b9085c3e84e7bb27c"
litebox_src_dir: "/root/litebox-src"

# Whether this host's HIVE_LITEBOX_VERIFIED=1 systemd drop-in should be
# applied — i.e. whether hive-cloud's backend-selection chain is allowed to
# actually pick Litebox on this node (crates/hive-cloud/src/main.rs).
#
# Default FALSE: this role only builds + stages the runner binary (Tier 1 —
# makes LiteboxBackend::is_supported() pass). It does NOT enable the backend
# by itself.
#
# Flip to true ONLY after running `hive-cloud --litebox-probe` on THIS
# specific host and getting a real PASS on BOTH of its checks (the syscall
# rewriter, and the full per-cell-TUN + patched-litebox + bind-shim network
# round trip added 2026-08-08 -- see crates/hive-backend/src/litebox.rs's
# module doc, "Networking" section, for exactly what that proves and what it
# still doesn't: Python is not covered by the bind-rewrite shim yet, and
# sustained concurrency under real production load has not been separately
# load tested). Mirrors the PVM canary program's manual-gate discipline
# (AGENTS.md "PVM kernels": "KVM_CREATE_VM succeeding does NOT mean microVMs
# work").
litebox_verified: false
