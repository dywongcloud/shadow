---
# Pinned AnEntrypoint/litebox commit (a full sha): this fork carries the fork()/wait4()/pty/job-control support the Sandboxes terminals need, which microsoft/litebox lacks;
# files/PATCHES.md ("Pin state", "litebox fork tracking") holds the rationale and the legitimacy check a bump needs (re-diff networking.patch, re-verify with --litebox-probe before rolling).
litebox_repo_url: "https://github.com/AnEntrypoint/litebox"
litebox_commit: "c325d5d9d446948b2b9030a3589bbee482b58c88"
litebox_src_dir: "/root/litebox-src"

# true applies this host's HIVE_LITEBOX_VERIFIED=1 drop-in so hive-cloud may select Litebox: set it only after `hive-cloud --litebox-probe` PASSES on this host (default false: the role only builds and stages the runner).
litebox_verified: false
