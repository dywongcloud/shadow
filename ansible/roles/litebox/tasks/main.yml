---
# Build + stage LiteBox (an unprivileged Linux syscall-sandboxing library
# originally from Microsoft, https://github.com/microsoft/litebox — this
# role tracks AnEntrypoint/litebox instead, see files/PATCHES.md's "litebox
# fork tracking" section for why) for hive-cloud's Litebox CellBackend
# (crates/hive-backend/src/litebox.rs). Targets nodes where neither real
# Firecracker microVMs nor the PVM software-virt fallback can safely run
# (see that module's doc comment and AGENTS.md's "PVM kernels" section for
# why fc-frankfurt specifically is in that state today).
#
# litebox ships no release binaries, so it's built from source the same way
# hive_platform builds hive-cloud itself (rustup already installed
# fleet-wide by roles/prerequisites) — its own, independent Cargo workspace,
# built standalone rather than added as a workspace member (it is not on
# crates.io and its own crate graph has no reason to be pulled into every
# hive-cloud compile).
#
# This role ONLY builds + stages the runner binary (Tier 1: makes the
# backend's existence check pass). It does NOT enable the backend — that is
# a SEPARATE, deliberate operator decision (litebox_verified=true) taken
# only after running `hive-cloud --litebox-probe` on this host and
# confirming a real functional PASS. See crates/hive-backend/src/litebox.rs's
# module doc and crates/hive-cloud/src/main.rs's backend-selection chain.

- name: Assert networking prerequisites for the per-cell TUN pipeline
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - "which ip"
    - "test -c /dev/net/tun"
  changed_when: false
  # Every plain-function cell gets its own TUN device with its own
  # independently-configured guest IP (see crates/hive-backend/src/
  # litebox.rs's module doc, "Networking" -- litebox's guest IP/gateway are
  # hardcoded at compile time upstream; files/networking.patch makes them
  # configurable per invocation, so no netns/veth isolation layer is needed
  # -- each cell just gets a distinct real address directly, the same way
  # FirecrackerBackend::setup_cell_net gives each microVM its own TAP). Both
  # prerequisites are confirmed present on fc-frankfurt already; asserting
  # here turns a missing prerequisite into a clear failure on a NEW target
  # host instead of a confusing runtime error the first time a function
  # tries to start.

- name: Ensure the litebox source directory's parent exists
  ansible.builtin.file:
    path: "{{ litebox_src_dir | dirname }}"
    state: directory
    mode: "0755"

- name: Clone litebox at the pinned commit
  ansible.builtin.git:
    repo: "{{ litebox_repo_url }}"
    dest: "{{ litebox_src_dir }}"
    version: "{{ litebox_commit }}"
    # The pin is a DANGLING commit upstream (AnEntrypoint/litebox rewrote its
    # history again on 2026-09-07; c325d5d9 is on no ref). A plain clone never
    # sees it and this task then fails before the patch/build/install steps
    # (witnessed 2026-09-09). GitHub still serves the object by full sha, and
    # this explicit refspec is what makes the module fetch it -- see
    # files/PATCHES.md ("Pin state") and PRD `litebox-pin-dangling-repin` for
    # the real fix (a reachable, legitimacy-checked pin).
    refspec: "+{{ litebox_commit }}:refs/remotes/origin/pinned"
    force: true

- name: Copy the fleet-hive networking patch to the target host (wildcard bind + per-invocation guest IP/gateway)
  ansible.builtin.copy:
    src: networking.patch
    dest: "{{ litebox_src_dir }}/../litebox-networking.patch"
    mode: "0644"

- name: Apply it (git apply -- clone above always resets tracked files to pristine, so this is idempotent every run)
  ansible.builtin.command:
    cmd: git apply ../litebox-networking.patch
    chdir: "{{ litebox_src_dir }}"
  register: _patch_apply
  changed_when: true
  failed_when: false

- name: Fail loudly if the patch no longer applies cleanly (litebox_commit moved -- re-diff files/networking.patch, see files/PATCHES.md)
  ansible.builtin.assert:
    that: _patch_apply.rc == 0
    fail_msg: >-
      files/networking.patch (see files/PATCHES.md) no longer applies cleanly
      against litebox_commit={{ litebox_commit }}: {{ _patch_apply.stderr }}
      -- re-diff it against the new pin before proceeding. Building unpatched
      would silently ship the wildcard-bind bug and the hardcoded
      single-instance guest IP back.

- name: Copy the fork patch to the target host (plain fork() of a single-threaded guest runs its child in place)
  ansible.builtin.copy:
    src: fork-inplace.patch
    dest: "{{ litebox_src_dir }}/../litebox-fork-inplace.patch"
    mode: "0644"

- name: Apply it on top of the networking patch (same idempotency argument -- the clone above resets tracked files every run)
  ansible.builtin.command:
    cmd: git apply ../litebox-fork-inplace.patch
    chdir: "{{ litebox_src_dir }}"
  register: _fork_patch_apply
  changed_when: true
  failed_when: false

- name: Fail loudly if the fork patch no longer applies cleanly (litebox_commit moved -- re-diff files/fork-inplace.patch, see files/PATCHES.md)
  ansible.builtin.assert:
    that: _fork_patch_apply.rc == 0
    fail_msg: >-
      files/fork-inplace.patch (see files/PATCHES.md, "Fork patch") no longer
      applies cleanly on top of networking.patch against
      litebox_commit={{ litebox_commit }}: {{ _fork_patch_apply.stderr }}
      -- re-diff it. Building without it would ship the wedge-on-the-second-
      external-command sandbox shell back.

- name: Copy the TCP keep-alive patch to the target host (setsockopt(TCP_KEEPIDLE/KEEPCNT/KEEPINTVL) must not fail an in-flight connect)
  ansible.builtin.copy:
    src: tcp-keepalive.patch
    dest: "{{ litebox_src_dir }}/../litebox-tcp-keepalive.patch"
    mode: "0644"

- name: Apply it on top of the networking + fork patches (same idempotency argument -- the clone above resets tracked files every run)
  ansible.builtin.command:
    cmd: git apply ../litebox-tcp-keepalive.patch
    chdir: "{{ litebox_src_dir }}"
  register: _keepalive_patch_apply
  changed_when: true
  failed_when: false

- name: Fail loudly if the keep-alive patch no longer applies cleanly (litebox_commit moved -- re-diff files/tcp-keepalive.patch, see files/PATCHES.md)
  ansible.builtin.assert:
    that: _keepalive_patch_apply.rc == 0
    fail_msg: >-
      files/tcp-keepalive.patch (see files/PATCHES.md, "TCP keep-alive patch")
      no longer applies cleanly on top of networking.patch + fork-inplace.patch
      against litebox_commit={{ litebox_commit }}:
      {{ _keepalive_patch_apply.stderr }} -- re-diff it. Building without it
      would ship the ENOTSUP-on-TCP_KEEPIDLE bug back: libuv's
      uv__tcp_keepalive (Node's socket.setKeepAlive, and therefore undici's
      global fetch) sets these while the connect is still in SYN_SENT, and
      EOPNOTSUPP there fails the PENDING connect.

- name: Build litebox_runner_linux_userland (release) -- long-running, first build is the slow one
  ansible.builtin.command:
    cmd: cargo build --release --bin litebox_runner_linux_userland
    chdir: "{{ litebox_src_dir }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  # No `creates:` guard here on purpose: the clone above force-resets tracked
  # files to pristine on every run and the patch task then re-applies
  # networking.patch on top -- "the binary already exists at this path" is
  # NOT the same as "the binary reflects the currently patched source"
  # (bit us once: a stale pre-patch binary silently got re-staged because
  # the file existed). `cargo build` is already incremental/idempotent on
  # its own -- an unchanged source tree rebuilds in well under a second --
  # so there is no real idempotency cost to just always invoking it.
  async: 1800
  poll: 15

- name: Confirm the runner binary was produced
  ansible.builtin.stat:
    path: "{{ litebox_src_dir }}/target/release/litebox_runner_linux_userland"
  register: _litebox_bin
  failed_when: not _litebox_bin.stat.exists

- name: Install the runner binary to /usr/local/bin/litebox-runner
  ansible.builtin.copy:
    src: "{{ litebox_src_dir }}/target/release/litebox_runner_linux_userland"
    dest: /usr/local/bin/litebox-runner
    mode: "0755"
    remote_src: true
  # No restart notify here on purpose: hive-node only reads this binary's
  # PATH at its own startup, and only when HIVE_LITEBOX_VERIFIED=1 is also
  # set. Staging the binary must never itself disturb an already-running
  # node — only actually flipping backend selection (the drop-in tasks
  # below) may restart it.

- name: Ensure the systemd drop-in directory exists (when verified)
  ansible.builtin.file:
    path: /etc/systemd/system/hive-node.service.d
    state: directory
    mode: "0755"
  when: litebox_verified | bool

- name: Write litebox-verified.conf (opt-in, only after a real --litebox-probe PASS)
  ansible.builtin.template:
    src: litebox-verified.conf.j2
    dest: /etc/systemd/system/hive-node.service.d/litebox-verified.conf
    mode: "0644"
  when: litebox_verified | bool
  notify: [reload systemd, restart hive-node]

- name: Remove litebox-verified.conf when not verified (safe default direction)
  ansible.builtin.file:
    path: /etc/systemd/system/hive-node.service.d/litebox-verified.conf
    state: absent
  when: not (litebox_verified | bool)
  notify: [reload systemd, restart hive-node]
