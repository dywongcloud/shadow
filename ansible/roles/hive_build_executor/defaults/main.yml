# Capability-blank by default: opt in per host with hive_build_executor_install; every host fact is supplied explicitly and asserted in tasks/main.yml.
hive_build_executor_install: false

# where the reviewed archive and the capability declaration live on the node
hive_build_executor_state_dir: /var/lib/hive/build-executor
hive_build_executor_archive_dest: /var/lib/hive/build-executor/hive-build-executor-v8.oci
hive_build_executor_capability_path: /var/lib/hive/build-executor.json
