---
# Opt-in static peer-trust allowlist (HIVE_PEER_TRUST=1): every node keeps its own HIVE_TRUSTED_NODE_IDS and rejects gossip from any iroh endpoint id not on it, so a new id must reach EVERY other node (playbooks/node-join.yml drives the loop).
# The default join-proof self-admit needs nothing here (RUNBOOK.md "Adding a node to the mesh").

- name: >-
    Refuse to deploy an EMPTY allowlist with peer-trust enabled -- this
    combination locks the node out of every peer (HIVE_PEER_TRUST=1 rejects
    gossip from any id not on the list, and an empty list matches nothing,
    not even genuinely trusted peers), the same lockout shape this session
    hit in production from a merely-incomplete list, just total instead of
    partial.
  ansible.builtin.assert:
    that: hive_trusted_node_ids | length > 0
    fail_msg: >-
      hive_peer_trust_enabled is true but hive_trusted_node_ids is empty.
      Deploying this would reject every peer's gossip, including genuinely
      trusted ones. Populate hive_trusted_node_ids (every fleet member's
      iroh endpoint id) before enabling peer-trust, or leave it disabled to
      use the default join-proof self-admit mechanism instead.
  when: hive_peer_trust_enabled | bool

- name: Template the peer-trust systemd drop-in (opt-in static allowlist)
  ansible.builtin.file:
    path: /etc/systemd/system/hive-node.service.d
    state: directory
    mode: "0755"
  when: hive_peer_trust_enabled | bool

- name: Write peer-trust.conf
  ansible.builtin.template:
    src: peer-trust.conf.j2
    dest: /etc/systemd/system/hive-node.service.d/peer-trust.conf
    mode: "0644"
  when: hive_peer_trust_enabled | bool
  notify: [reload systemd, restart hive-node]

- name: Remove the drop-in when peer-trust is disabled (self-admit only)
  ansible.builtin.file:
    path: /etc/systemd/system/hive-node.service.d/peer-trust.conf
    state: absent
  when: not (hive_peer_trust_enabled | bool)
  notify: [reload systemd, restart hive-node]
