---
# Headless browser node: ONE per host, on the hosts in [browser_nodes]; see
# roles/hive_browser_node/README.md for the auth + caps reasoning.

# The exact hive_name set this role may run against, asserted per host; widen the list, not the assert.
hive_browser_node_allowed:
  - fc-bangkok
  - fc-sanjose
  - fc-virginia
  - fc-saopaulo
  - fc-frankfurt
  - fc-hongkong

hive_browser_node_root: /opt/hive-browser-node
hive_browser_node_state_dir: /var/lib/hive/browser-node
hive_browser_node_user: hive-browser
hive_browser_node_group: hive-browser
hive_browser_node_port: 3009
hive_browser_node_token_file: /etc/hive/browser-node.internal-token
hive_browser_node_env_file: /etc/hive/browser-node.env

# Google Chrome stable from Google's signed RPM repo (EPEL chromium is not reliably available on TencentOS/Rocky;
# `--headless=new` is the full browser); point _chrome_package/_bin at a distro chromium to use one.
hive_browser_node_chrome_package: google-chrome-stable
hive_browser_node_chrome_bin: /usr/bin/google-chrome-stable
hive_browser_node_manage_chrome_repo: true
hive_browser_node_chrome_repo_baseurl: "https://dl.google.com/linux/chrome/rpm/stable/{{ ansible_architecture }}"
hive_browser_node_chrome_repo_gpgkey: "https://dl.google.com/linux/linux_signing_key.pub"

# The namespace sandbox stays ON; set true only with a written reason (tenant browser functions are untrusted JS).
hive_browser_node_no_sandbox: false
# NoNewPrivileges blocks only the legacy setuid chrome-sandbox fallback; left true so a host without userns fails loudly.
hive_browser_node_no_new_privileges: true

# The tenant whose browser-eligible deployments this node serves: "personal" is the platform owner's namespace,
# an org slug donates capacity to a team.
hive_browser_node_team: personal
# "member" is the least-privilege role for a TEAM-scope admission; owner/admin would satisfy `may_serve_public`.
hive_browser_node_role: member
hive_browser_node_scope: team
# "auto" = the fleet derives this tenant's whole browser-eligible set on every renewal; "none" = capacity only.
hive_browser_node_serve_mode: auto
# Optional explicit pin (both must be set together); empty = the automatic set.
hive_browser_node_deployment: ""
hive_browser_node_function: ""

# WSS relays (ui/lib/use-run-node.ts's DEFAULT_RELAYS); the https :3343 form is mandatory (plaintext :3340 is captive-portal-only).
hive_browser_node_relays: >-
  https://fc-sanjose.relay.shadw.app:3343,https://fc-bangkok.relay.shadw.app:3343,https://fc-virginia.relay.shadw.app:3343

hive_browser_node_memory_max_mb: "{{ [[(ansible_memtotal_mb | int) // 16, 768] | max, 2048] | min }}"
hive_browser_node_memory_high_mb: "{{ ((hive_browser_node_memory_max_mb | int) * 75) // 100 }}"
hive_browser_node_cpu_quota_pct: "{{ [[((ansible_processor_vcpus | int) * 100) // 16, 50] | max, 200] | min }}"
hive_browser_node_tasks_max: 384
# V8's heap ceiling at 40% of the cgroup bound: the other browser processes and the wasm linear memory sit outside
# --max-old-space-size.
hive_browser_node_js_heap_mb: "{{ ((hive_browser_node_memory_max_mb | int) * 40) // 100 }}"
# Relative share when the box is saturated; hive-node runs at the default weight of 100, so 20 gives it 5:1.
hive_browser_node_cpu_weight: 20
hive_browser_node_io_weight: 20
hive_browser_node_oom_score_adjust: 700
hive_browser_node_nice: 10
# Daily recycle (randomized across nodes) bounds renderer growth; costs one presence gap well under the 90 s TTL.
hive_browser_node_runtime_max_sec: 86400
hive_browser_node_runtime_randomized_extra_sec: 3600

hive_browser_node_broker_memory_max_mb: 192
hive_browser_node_broker_cpu_quota_pct: 25
hive_browser_node_broker_tasks_max: 32

hive_browser_node_health_poll_secs: 30
hive_browser_node_health_fail_limit: 4     # 4 x 30s = a 2-minute dead-node budget
hive_browser_node_heartbeat_stale_ms: 75000
hive_browser_node_boot_grace_ms: 300000
