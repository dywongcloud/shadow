---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart hive-browser-node-broker
  ansible.builtin.systemd:
    name: hive-browser-node-broker
    state: restarted
    daemon_reload: true

- name: restart hive-browser-node
  ansible.builtin.systemd:
    name: hive-browser-node
    state: restarted
    daemon_reload: true
