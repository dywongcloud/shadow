---

- name: "Gate: this host is on the authorized browser-node roster"
  ansible.builtin.assert:
    that: hive_name in hive_browser_node_allowed
    fail_msg: >-
      {{ hive_name }} is not in hive_browser_node_allowed
      ({{ hive_browser_node_allowed | join(', ') }}). A browser node consumes
      real memory/CPU on a host that is also running the platform, so the
      roster is an explicit allowlist, not a --limit convention.

- name: "Gate: dnf-based distro (matches roles/prerequisites' own assert)"
  ansible.builtin.assert:
    that: ansible_pkg_mgr == "dnf"
    fail_msg: >-
      This role's package tasks are dnf-based, matching the rest of this repo.
      Porting to apt means swapping the dnf task below and the Chrome repo task
      for their Debian equivalents; nothing else here is package-manager aware.

- name: "Gate: the host is large enough for a capped browser node"
  ansible.builtin.assert:
    that:
      - (hive_browser_node_memory_max_mb | int) * 4 <= (ansible_memtotal_mb | int)
      - (ansible_processor_vcpus | int) >= 2
    fail_msg: >-
      {{ inventory_hostname }} has {{ ansible_memtotal_mb }} MiB /
      {{ ansible_processor_vcpus }} vCPU. The computed cap
      ({{ hive_browser_node_memory_max_mb }} MiB) would be more than a quarter
      of this host's RAM — refusing rather than starving hive-node.

- name: Read the unprivileged-user-namespace limit (Chromium's sandbox needs it)
  ansible.builtin.command: cat /proc/sys/user/max_user_namespaces
  register: hive_bn_userns
  changed_when: false
  failed_when: false

- name: "Gate: unprivileged user namespaces are available (or the sandbox is explicitly waived)"
  ansible.builtin.assert:
    that:
      - hive_browser_node_no_sandbox | bool
        or ((hive_bn_userns.stdout | default('0') | trim | int) > 0)
    fail_msg: >-
      user.max_user_namespaces is 0 on {{ inventory_hostname }}, so Chromium's
      namespace sandbox cannot start and the browser would refuse to launch.
      Fix it properly —
        sysctl -w user.max_user_namespaces=15000 (and a /etc/sysctl.d drop-in)
      — or, only with a written reason, re-run with
      -e hive_browser_node_no_sandbox=true. Never the latter silently: tenant
      browser functions are untrusted JS by design and this host also runs
      hive-node.

- name: "Gate: the browser-node bundle exists in the control host's checkout"
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../ui/public/browser-node/pkg/hive_browser_bg.wasm"
  delegate_to: localhost
  become: false
  register: hive_bn_wasm

- name: "Gate: fail loudly if the wasm bundle is missing locally"
  ansible.builtin.assert:
    that: hive_bn_wasm.stat.exists
    fail_msg: >-
      ui/public/browser-node/pkg/hive_browser_bg.wasm is missing from this
      checkout. That bundle is committed (see `git ls-files
      ui/public/browser-node`); a shallow/partial checkout cannot deploy a
      browser node.

- name: Configure Google's signed Chrome RPM repository
  ansible.builtin.yum_repository:
    name: google-chrome
    description: google-chrome
    baseurl: "{{ hive_browser_node_chrome_repo_baseurl }}"
    gpgkey: "{{ hive_browser_node_chrome_repo_gpgkey }}"
    gpgcheck: true
    enabled: true
  when: hive_browser_node_manage_chrome_repo | bool

- name: Install the headless browser + the fonts it needs to render at all
  ansible.builtin.dnf:
    name:
      - "{{ hive_browser_node_chrome_package }}"
      - liberation-fonts
    state: present
  notify: restart hive-browser-node

- name: Resolve the installed browser binary
  ansible.builtin.stat:
    path: "{{ hive_browser_node_chrome_bin }}"
  register: hive_bn_chrome

- name: "Gate: the configured browser binary actually exists"
  ansible.builtin.assert:
    that: hive_bn_chrome.stat.exists and hive_bn_chrome.stat.executable
    fail_msg: >-
      {{ hive_browser_node_chrome_bin }} is missing after installing
      {{ hive_browser_node_chrome_package }} — set hive_browser_node_chrome_bin
      to the real path (e.g. /usr/bin/chromium-browser for a distro build).

- name: Record the installed browser version (drift is a real CVE surface)
  ansible.builtin.command: "{{ hive_browser_node_chrome_bin }} --version"
  register: hive_bn_chrome_version
  changed_when: false

- name: Show the browser version this host will run
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} ({{ hive_name }}): {{ hive_bn_chrome_version.stdout | trim }}"

- name: "Gate: /usr/bin/curl exists (the supervisor's health probe)"
  ansible.builtin.stat:
    path: /usr/bin/curl
  register: hive_bn_curl
  failed_when: not hive_bn_curl.stat.exists

- name: Verify node >= 18 (the broker uses the global fetch)
  ansible.builtin.shell: |
    set -e
    PATH=/usr/local/bin:/usr/bin:/bin
    node -e 'if (Number(process.versions.node.split(".")[0]) < 18) { console.error("node " + process.versions.node + " < 18"); process.exit(1) }'
  register: hive_bn_node
  changed_when: false

- name: Create the browser-node system group
  ansible.builtin.group:
    name: "{{ hive_browser_node_group }}"
    system: true

- name: Create the browser-node system user (no shell, no login)
  ansible.builtin.user:
    name: "{{ hive_browser_node_user }}"
    group: "{{ hive_browser_node_group }}"
    system: true
    shell: /sbin/nologin
    home: "{{ hive_browser_node_state_dir }}"
    create_home: false

- name: Create the browser-node directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ hive_browser_node_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ hive_browser_node_root }}/bin", owner: root, group: root, mode: "0755" }
    - { path: "{{ hive_browser_node_root }}/www", owner: root, group: root, mode: "0755" }
    - { path: "{{ hive_browser_node_state_dir }}", owner: "{{ hive_browser_node_user }}", group: "{{ hive_browser_node_group }}", mode: "0750" }
    - { path: "{{ hive_browser_node_state_dir }}/profile", owner: "{{ hive_browser_node_user }}", group: "{{ hive_browser_node_group }}", mode: "0750" }
    - { path: /etc/hive, owner: root, group: root, mode: "0755" }

- name: Install the session broker
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/hive-browser-node-broker.mjs"
    dest: "{{ hive_browser_node_root }}/bin/hive-browser-node-broker.mjs"
    owner: root
    group: root
    mode: "0755"
  notify: restart hive-browser-node-broker

- name: Install the browser supervisor
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/hive-browser-node-run.sh"
    dest: "{{ hive_browser_node_root }}/bin/hive-browser-node-run.sh"
    owner: root
    group: root
    mode: "0755"
  notify: restart hive-browser-node

- name: Install the headless host page
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/hive-browser-node-page.html"
    dest: "{{ hive_browser_node_root }}/www/index.html"
    owner: root
    group: root
    mode: "0644"
  notify: restart hive-browser-node

- name: Install the run-node worker (verbatim from ui/public)
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../ui/public/run-node-worker.js"
    dest: "{{ hive_browser_node_root }}/www/run-node-worker.js"
    owner: root
    group: root
    mode: "0644"
  notify: restart hive-browser-node

- name: Sync the browser-node bundle (wasm, identity, quickjs runtime, sqlite VFS)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../ui/public/browser-node/"
    dest: "{{ hive_browser_node_root }}/www/browser-node/"
    delete: true
    rsync_opts:
      - "--exclude=*.d.ts"
  notify: restart hive-browser-node

- name: Install the internal-token credential (root-only, never in a unit)
  ansible.builtin.copy:
    content: "{{ vault_hive_internal_token }}"
    dest: "{{ hive_browser_node_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart hive-browser-node-broker

- name: Template the non-secret broker/browser configuration
  ansible.builtin.template:
    src: browser-node.env.j2
    dest: "{{ hive_browser_node_env_file }}"
    owner: root
    group: "{{ hive_browser_node_group }}"
    mode: "0640"
  notify: [restart hive-browser-node-broker, restart hive-browser-node]

- name: Locate the node binary
  ansible.builtin.shell: |
    set -u
    p="$(command -v node 2>/dev/null || true)"
    if [ -z "$p" ]; then
      for c in /usr/local/bin/node /usr/bin/node /opt/node/bin/node; do
        [ -x "$c" ] && { p="$c"; break; }
      done
    fi
    printf '%s' "$p"
  args:
    executable: /bin/bash
  register: hive_browser_node_node_which
  changed_when: false
  failed_when: false

- name: Require node on the host
  ansible.builtin.assert:
    that:
      - (hive_browser_node_node_which.stdout | default('') | trim) | length > 0
    fail_msg: >-
      node was not found on {{ inventory_hostname }}. The browser-node broker is a
      node script and systemd cannot PATH-resolve it, so an absolute path is
      required. Install node, then re-run.

- name: Record the resolved node path
  ansible.builtin.set_fact:
    hive_browser_node_node_bin: "{{ hive_browser_node_node_which.stdout | trim }}"

- name: Template the broker unit
  ansible.builtin.template:
    src: hive-browser-node-broker.service.j2
    dest: /etc/systemd/system/hive-browser-node-broker.service
    owner: root
    group: root
    mode: "0644"
  notify: [reload systemd, restart hive-browser-node-broker]

- name: Template the browser unit
  ansible.builtin.template:
    src: hive-browser-node.service.j2
    dest: /etc/systemd/system/hive-browser-node.service
    owner: root
    group: root
    mode: "0644"
  notify: [reload systemd, restart hive-browser-node]

- name: Install the external browser-node watchdog
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/hive-browser-node-watchdog.sh"
    dest: "{{ hive_browser_node_root }}/bin/hive-browser-node-watchdog.sh"
    owner: root
    group: root
    mode: "0755"

- name: Template the watchdog unit + timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: hive-browser-node-watchdog.service.j2, dest: hive-browser-node-watchdog.service }
    - { src: hive-browser-node-watchdog.timer.j2, dest: hive-browser-node-watchdog.timer }
  notify: reload systemd

- name: Flush handlers so the verification below sees the final state
  ansible.builtin.meta: flush_handlers

- name: Enable + start the broker
  ansible.builtin.systemd:
    name: hive-browser-node-broker
    state: started
    enabled: true
    daemon_reload: true

- name: Enable + start the browser node
  ansible.builtin.systemd:
    name: hive-browser-node
    state: started
    enabled: true
    daemon_reload: true

- name: Enable + start the watchdog timer
  ansible.builtin.systemd:
    name: hive-browser-node-watchdog.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the broker to answer on loopback
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hive_browser_node_port }}/healthz"
    status_code: [200, 503]
  register: hive_bn_broker_up
  retries: 15
  delay: 2
  until: hive_bn_broker_up.status in [200, 503]

- name: Wait for the browser node to reach lifecycle=online with a granted admission
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hive_browser_node_port }}/healthz"
    status_code: [200, 503]
    return_content: true
  register: hive_bn_health
  retries: 30
  delay: 10
  until:
    - (hive_bn_health.json.lifecycle | default('')) in ['online', 'suspended']
    - (hive_bn_health.json.admission | default('')) == 'granted'
    - (hive_bn_health.json.endpoint_id | default('')) | length > 0

- name: Report the live browser node
  ansible.builtin.debug:
    msg: >-
      {{ hive_name }}: endpoint={{ hive_bn_health.json.endpoint_id }}
      lifecycle={{ hive_bn_health.json.lifecycle }}
      admission={{ hive_bn_health.json.admission }}
      serving={{ hive_bn_health.json.serving }}
      relay={{ hive_bn_health.json.relay }}
      team={{ hive_bn_health.json.team }}
      geo={{ hive_bn_health.json.geo_source | default('?') }}
      geo_error={{ hive_bn_health.json.geo_error | default('none') or 'none' }}
      caps=[mem {{ hive_browser_node_memory_max_mb }}MiB / cpu {{ hive_browser_node_cpu_quota_pct }}% / tasks {{ hive_browser_node_tasks_max }}]

- name: "Gate: exactly ONE browser-node unit is running on this host"
  ansible.builtin.shell: |
    set -o pipefail
    systemctl list-units --type=service --state=running --no-legend 'hive-browser-node*.service' | wc -l
  args:
    executable: /bin/bash
  register: hive_bn_units
  changed_when: false
  failed_when: (hive_bn_units.stdout | trim | int) != 2   # the browser + its broker, nothing else
