---
# Keep GitHub App credentials out of the world-readable systemd unit. Validate
# a staged key before changing any active file, then publish the EnvironmentFile
# before its drop-in. On removal, the inverse order keeps every intermediate
# unit composition valid.

- name: Reconcile hive-node GitHub App credentials
  block:
    - name: Read GitHub App inputs without exposing them
      ansible.builtin.set_fact:
        _github_app_id_input: >-
          {{
            ''
            if (vault_github_app_id | default(none)) is none
            else (vault_github_app_id | string | trim)
          }}
        _github_app_private_key_input: >-
          {{
            ''
            if (vault_github_app_private_key | default(none)) is none
            else (vault_github_app_private_key | string)
          }}
      no_log: true
      diff: false
      changed_when: false

    - name: Derive non-secret GitHub App configuration state
      ansible.builtin.set_fact:
        _github_app_has_id: "{{ (_github_app_id_input | length) > 0 }}"
        _github_app_has_private_key: "{{ (_github_app_private_key_input | length) > 0 }}"
        _github_app_escaped_newline: '\n'
        _github_app_real_newline: "\n"
      no_log: true
      diff: false
      changed_when: false

    - name: Require the GitHub App ID and private key as a complete pair
      ansible.builtin.assert:
        that:
          - (_github_app_has_id | bool) == (_github_app_has_private_key | bool)
        quiet: true
        fail_msg: >-
          GitHub App credentials are incomplete: configure both
          vault_github_app_id and vault_github_app_private_key, or neither.

    - name: Derive GitHub App pair and ID validity without exposing values
      ansible.builtin.set_fact:
        _github_app_configured: "{{ (_github_app_has_id | bool) and (_github_app_has_private_key | bool) }}"
        _github_app_id_valid: >-
          {{
            (_github_app_id_input is match('^[0-9]+$'))
            and ((_github_app_id_input | int) > 0)
            and ((_github_app_id_input | int) <= 18446744073709551615)
          }}
      no_log: true
      diff: false
      changed_when: false

    - name: Require a nonzero decimal GitHub App ID
      ansible.builtin.assert:
        that:
          - _github_app_id_valid | bool
        quiet: true
        fail_msg: GitHub App ID must be a nonzero decimal unsigned 64-bit integer.
      when: _github_app_configured | bool

    - name: Validate and publish the configured GitHub App pair
      when: _github_app_configured | bool
      block:
        # This is byte-for-byte the runtime rule in github_app_auth.rs: only a
        # value containing escaped newlines and no real newline is expanded.
        - name: Normalize escaped private-key newlines like the runtime
          ansible.builtin.set_fact:
            _github_app_private_key_normalized: >-
              {{
                (_github_app_private_key_input | replace(_github_app_escaped_newline, _github_app_real_newline))
                if (_github_app_escaped_newline in _github_app_private_key_input and _github_app_real_newline not in _github_app_private_key_input)
                else _github_app_private_key_input
              }}
          no_log: true
          diff: false
          changed_when: false

        - name: Detect encrypted private-key formats the runtime cannot unlock
          ansible.builtin.set_fact:
            _github_app_private_key_unencrypted: >-
              {{
                '-----BEGIN ENCRYPTED PRIVATE KEY-----' not in (_github_app_private_key_normalized | upper)
                and 'PROC-TYPE: 4,ENCRYPTED' not in (_github_app_private_key_normalized | upper)
              }}
          no_log: true
          diff: false
          changed_when: false

        - name: Require an unencrypted GitHub App private key
          ansible.builtin.assert:
            that:
              - _github_app_private_key_unencrypted | bool
            quiet: true
            fail_msg: GitHub App private key must be unencrypted for unattended startup.

        - name: Create a root-only GitHub App staging directory
          ansible.builtin.tempfile:
            state: directory
            path: /etc
            prefix: .hive-github-app.
          register: _github_app_stage
          changed_when: false

        - name: Stage the normalized GitHub App private key
          ansible.builtin.copy:
            dest: "{{ _github_app_stage.path }}/private-key.pem"
            content: "{{ _github_app_private_key_normalized }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true
          diff: false
          changed_when: false

        - name: Cryptographically validate the staged RSA private key
          ansible.builtin.command:
            argv:
              - openssl
              - rsa
              - -check
              - -noout
              - -passin
              - "pass:"
              - -in
              - "{{ _github_app_stage.path }}/private-key.pem"
          changed_when: false
          no_log: true
          diff: false

        # A single-quoted systemd EnvironmentFile value preserves literal \n.
        # The Rust runtime then performs the same one-time expansion validated
        # above, so the process receives the original normalized PEM bytes.
        - name: Stage the GitHub App EnvironmentFile
          ansible.builtin.copy:
            dest: "{{ _github_app_stage.path }}/hive-github-app.env"
            content: |
              GITHUB_APP_ID={{ _github_app_id_input }}
              GITHUB_APP_PRIVATE_KEY='{{ _github_app_private_key_normalized | replace(_github_app_real_newline, _github_app_escaped_newline) }}'
            owner: root
            group: root
            mode: "0600"
          no_log: true
          diff: false
          changed_when: false

        # This EnvironmentFile is Task #20's world-readable-unit fix, not the
        # final custody boundary: systemd still expands it into hive-node's
        # /proc/<pid>/environ. Validation/staging is deliberately separate from
        # these two publication tasks so a later LoadCredential/FD migration is
        # narrow and does not fork credential validation.
        - name: Atomically publish the validated GitHub App EnvironmentFile
          ansible.builtin.copy:
            src: "{{ _github_app_stage.path }}/hive-github-app.env"
            dest: /etc/hive-github-app.env
            remote_src: true
            owner: root
            group: root
            mode: "0600"
            unsafe_writes: false
          no_log: true
          diff: false
          notify: [reload systemd, restart hive-node]

        - name: Ensure the hive-node drop-in directory exists
          ansible.builtin.file:
            path: /etc/systemd/system/hive-node.service.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Publish the path-only GitHub App systemd drop-in
          ansible.builtin.copy:
            dest: /etc/systemd/system/hive-node.service.d/github-app.conf
            owner: root
            group: root
            mode: "0644"
            unsafe_writes: false
            content: |
              [Service]
              EnvironmentFile=/etc/hive-github-app.env
          notify: [reload systemd, restart hive-node]

    # Configured path: valid env + drop-in already exist. Absent path: the old
    # drop-in still supplies any prior valid pair until this secret-free unit
    # has been published.
    - name: Publish the hive-node unit without inline GitHub credentials
      ansible.builtin.template:
        src: hive-node.service.j2
        dest: /etc/systemd/system/hive-node.service
        owner: root
        group: root
        mode: "0644"
        unsafe_writes: false
      no_log: true
      diff: false
      notify: [reload systemd, restart hive-node]

    - name: Remove stale GitHub App files when credentials are absent
      when: not (_github_app_configured | bool)
      block:
        - name: Remove the GitHub App systemd drop-in first
          ansible.builtin.file:
            path: /etc/systemd/system/hive-node.service.d/github-app.conf
            state: absent
          no_log: true
          diff: false
          notify: [reload systemd, restart hive-node]

        - name: Remove the now-unreferenced GitHub App EnvironmentFile
          ansible.builtin.file:
            path: /etc/hive-github-app.env
            state: absent
          no_log: true
          diff: false
          notify: [reload systemd, restart hive-node]

  always:
    - name: Remove root-only GitHub App staging material
      ansible.builtin.file:
        path: "{{ _github_app_stage.path }}"
        state: absent
      when:
        - _github_app_stage is defined
        - _github_app_stage.path is defined
      no_log: true
      diff: false
      changed_when: false

    - name: Clear GitHub App secret facts from the remaining play
      ansible.builtin.set_fact:
        _github_app_id_input: ""
        _github_app_private_key_input: ""
        _github_app_private_key_normalized: ""
      no_log: true
      diff: false
      changed_when: false
