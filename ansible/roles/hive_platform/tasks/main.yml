---
# Deploy the hive-cloud controller and its exact hive-cell-agent companion to one
# node. Source is pushed from the Ansible control host's checkout; both binaries
# are compiled in one Cargo invocation, so a later manual rootfs bake cannot
# consume bootstrap-vintage guest code.

- name: Ensure the source directory exists on the target
  ansible.builtin.file:
    path: "{{ hive_src_dir }}"
    state: directory
    mode: "0755"

- name: Sync crates/ (the whole Cargo workspace's source)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../crates/"
    dest: "{{ hive_src_dir }}/crates/"
    delete: true
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"

# vendor/ needs the SAME excludes as crates/ above. Without them this ships
# vendor/guardian-db/target — 2.9GB of local build artifacts (gitignored, so
# invisible in the repo) plus a 155MB tmp/ — to every node on every deploy,
# against 4.3MB of actual source.
- name: Sync vendor/ (patched crates, e.g. guardian-db)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../vendor/"
    dest: "{{ hive_src_dir }}/vendor/"
    delete: true
    rsync_opts:
      - "--exclude=target"
      - "--exclude=tmp"
      - "--exclude=.git"

- name: Copy Cargo.toml + Cargo.lock (workspace manifest, exact-pinned)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item }}"
    dest: "{{ hive_src_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - Cargo.toml
    - Cargo.lock

- name: Build hive-cloud + hive-cell-agent from one release source snapshot
  ansible.builtin.command:
    cmd: cargo build --release -p hive-cloud -p hive-cell-agent
    chdir: "{{ hive_src_dir }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
    CARGO_TARGET_DIR: "{{ hive_cargo_target_dir }}"
  async: 1800
  poll: 15
  register: _build
  notify: restart hive-node

- name: Confirm the controller binary was produced
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
  register: _bin
  failed_when: not _bin.stat.exists

- name: Confirm and checksum the companion cell-agent binary
  ansible.builtin.stat:
    path: "{{ hive_cargo_target_dir }}/release/hive-cell-agent"
    get_checksum: true
    checksum_algorithm: sha256
  register: _cell_agent_build
  failed_when: >-
    not (_cell_agent_build.stat.exists | default(false)) or
    not (_cell_agent_build.stat.isreg | default(false)) or
    (_cell_agent_build.stat.checksum | default('') | length) != 64

- name: Install the fail-closed cell-agent release publisher
  ansible.builtin.copy:
    src: "{{ role_path }}/files/install-cell-agent.sh"
    dest: /usr/local/sbin/hive-install-cell-agent
    owner: root
    group: root
    mode: "0755"

- name: Inspect the previously installed cell-agent package
  ansible.builtin.stat:
    path: "{{ hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent') }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _cell_agent_before

- name: Inspect the previously installed cell-agent release fact
  ansible.builtin.stat:
    path: "{{ hive_cell_agent_release_fact_path | default('/usr/local/bin/hive-cell-agent.release.json') }}"
  register: _cell_agent_fact_before

# The publisher copies into /usr/local/bin first, SHA-verifies it, then gives the
# candidate a hard-bounded exact protocol-fact probe. Only a complete schema-2
# release fact is atomically switched into place. The previous binary remains at
# hive-cell-agent.old.
- name: Preflight and atomically install the exact built cell-agent
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/hive-install-cell-agent
      - "{{ hive_cargo_target_dir }}/release/hive-cell-agent"
      - "{{ hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent') }}"
  environment:
    CELL_AGENT_EXPECTED_SHA256: "{{ _cell_agent_build.stat.checksum }}"
    CELL_AGENT_ROOTFS_SCHEMA_EXPECTED: "{{ hive_runtime_artifact_rootfs_schema_expected | default(2) | string }}"
    CELL_AGENT_PROTOCOL_EXPECTED: "{{ hive_runtime_artifact_protocol_expected | default(1) | string }}"
    CELL_AGENT_WIRE_PROTOCOL_EXPECTED: "{{ hive_agent_wire_protocol_expected | default(2) | string }}"
    CELL_AGENT_WIRE_CAPABILITIES_EXPECTED: "{{ hive_agent_wire_capabilities_expected | default(31) | string }}"
    CELL_AGENT_PROTOCOL_TIMEOUT_SECS: "{{ hive_cell_agent_protocol_timeout_seconds | default(5) | string }}"
    CELL_AGENT_RELEASE_FACT: "{{ hive_cell_agent_release_fact_path | default('/usr/local/bin/hive-cell-agent.release.json') }}"
  register: _cell_agent_install
  changed_when: >-
    (_cell_agent_before.stat.checksum | default('')) != _cell_agent_build.stat.checksum or
    not (_cell_agent_fact_before.stat.exists | default(false))

- name: Require the installer to return the exact parseable release fact
  vars:
    _fact: "{{ _cell_agent_install.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - _fact.keys() | sort == ['agent_sha256', 'agent_wire_capabilities', 'agent_wire_protocol', 'rootfs_schema', 'runtime_artifact_protocol', 'schema']
      - (_fact.schema | int) == 2
      - (_fact.rootfs_schema | int) == (hive_runtime_artifact_rootfs_schema_expected | default(2) | int)
      - (_fact.runtime_artifact_protocol | int) == (hive_runtime_artifact_protocol_expected | default(1) | int)
      - (_fact.agent_wire_protocol | int) == (hive_agent_wire_protocol_expected | default(2) | int)
      - (_fact.agent_wire_capabilities | int) == (hive_agent_wire_capabilities_expected | default(31) | int)
      - _fact.agent_sha256 == _cell_agent_build.stat.checksum
    fail_msg: >-
      The installed cell-agent did not attest the exact digest, rootfs schema,
      runtime-artifact protocol, wire protocol and capability set built alongside
      hive-cloud; no rootfs may consume it.

- name: Verify the installed cell-agent bytes and release-fact ownership
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: "{{ item.checksum }}"
    checksum_algorithm: sha256
  loop:
    - path: "{{ hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent') }}"
      checksum: true
    - path: "{{ hive_cell_agent_release_fact_path | default('/usr/local/bin/hive-cell-agent.release.json') }}"
      checksum: false
  register: _cell_agent_installed_files

- name: Fail closed unless the installed package is exact and immutable
  vars:
    _installed: "{{ _cell_agent_installed_files.results[0].stat }}"
    _release: "{{ _cell_agent_installed_files.results[1].stat }}"
  ansible.builtin.assert:
    that:
      - _installed.exists
      - _installed.isreg
      - _installed.pw_name == 'root'
      - _installed.gr_name == 'root'
      - _installed.mode == '0755'
      - _installed.checksum == _cell_agent_build.stat.checksum
      - _release.exists
      - _release.isreg
      - _release.pw_name == 'root'
      - _release.gr_name == 'root'
      - _release.mode == '0444'
    fail_msg: >-
      Cell-agent publication did not leave root-owned mode-0755 bytes plus a
      root-owned mode-0444 release fact matching the canonical build.

# The browser_db lanes (CRR exchange + browser_db_rest) hard-refuse every
# round when the cr-sqlite loadable extension is missing — and nothing in a
# backend-only roll ships it (the binary's baked default path points into the
# source tree, which only full hive_platform runs sync).
- name: Build the cr-sqlite loadable extension (no-op when current)
  ansible.builtin.command:
    cmd: make
    chdir: "{{ hive_src_dir }}/vendor/cr-sqlite"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  async: 1800
  poll: 15

- name: Install the packaged extension when its content changed
  ansible.builtin.shell: |
    set -e
    src="{{ hive_src_dir }}/vendor/cr-sqlite/core/dist/crsqlite.so"
    dst=/var/lib/hive/crsqlite.so
    if [ ! -f "$dst" ] || ! cmp -s "$src" "$dst"; then
      install -m 0755 "$src" "$dst"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: _crsqlite
  changed_when: "'CHANGED' in _crsqlite.stdout"
  notify: restart hive-node

- name: Ensure the hive-node systemd drop-in directory exists (fresh nodes lack it until the unit lands)
  ansible.builtin.file:
    path: /etc/systemd/system/hive-node.service.d
    state: directory
    mode: "0755"

- name: Drop in HIVE_CRSQL_EXTENSION_PATH for hive-node
  ansible.builtin.copy:
    dest: /etc/systemd/system/hive-node.service.d/crsqlite.conf
    mode: "0644"
    content: |
      [Service]
      Environment=HIVE_CRSQL_EXTENSION_PATH=/var/lib/hive/crsqlite.so
  notify: [reload systemd, restart hive-node]

- name: Reconcile the hive-node unit and GitHub App credentials
  ansible.builtin.include_tasks:
    file: github_app_credentials.yml
    apply:
      tags:
        - github_app_credentials
  tags:
    - github_app_credentials

- name: Flush handlers now (so the health check below sees the final state)
  ansible.builtin.meta: flush_handlers

- name: Enable + start hive-node
  ansible.builtin.systemd:
    name: hive-node
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the admin port to answer
  ansible.builtin.uri:
    url: "http://{{ hive_admin }}/v1/mesh"
    method: GET
    status_code: 200
  register: _mesh
  retries: 12
  delay: 5
  until: _mesh.status == 200

- name: Report mesh health
  ansible.builtin.debug:
    msg: "{{ hive_name }}: /v1/mesh -> {{ _mesh.json }}"
