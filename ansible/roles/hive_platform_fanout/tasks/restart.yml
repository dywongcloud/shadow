---
# Runs serially. The controller and cell agent are one release pair: both
# canonical digests must exist, both are verified in place before hive-node is
# restarted, and the agent's prior bytes remain at hive-cell-agent.old.

- name: Require a canonical controller+agent pair for this glibc group
  ansible.builtin.assert:
    that:
      - hostvars[hive_group_build_host].hive_group_build_sha256 is defined
      - (hostvars[hive_group_build_host].hive_group_build_sha256 | default('') | length) == 64
      - hostvars[hive_group_build_host].hive_group_cell_agent_sha256 is defined
      - (hostvars[hive_group_build_host].hive_group_cell_agent_sha256 | default('') | length) == 64
    fail_msg: >-
      NOTHING COMPLETE WAS BUILT for glibc group '{{ hive_glibc_group }}' in
      this run. Refusing to publish or restart {{ hive_name }} without both a
      canonical hive-cloud digest and canonical hive-cell-agent digest. Build
      host for this group: '{{ hive_group_build_host }}'.

- name: Build host -- controller is already canonical, nothing to swap
  ansible.builtin.debug:
    msg: "{{ hive_name }}: build host, controller already at {{ hive_binary_path }}"
  when: inventory_hostname == hive_group_build_host

- name: Follower -- record the controller content before the swap
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _pre_swap
  when: inventory_hostname != hive_group_build_host

- name: Follower -- publish the pre-swap controller digest
  ansible.builtin.set_fact:
    hive_pre_deploy_sha: "{{ _pre_swap.stat.checksum | default('') }}"
  when: inventory_hostname != hive_group_build_host

- name: Record the installed cell-agent content before publication
  ansible.builtin.stat:
    path: "{{ hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent') }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _pre_agent_install

- name: Record the installed cell-agent release fact before publication
  ansible.builtin.stat:
    path: "{{ hive_cell_agent_release_fact_path | default('/usr/local/bin/hive-cell-agent.release.json') }}"
  register: _pre_agent_fact

- name: Publish the pre-install cell-agent digest
  ansible.builtin.set_fact:
    hive_pre_agent_sha: "{{ _pre_agent_install.stat.checksum | default('') }}"

- name: Follower -- back up the running controller before swap
  ansible.builtin.copy:
    src: "{{ hive_binary_path }}"
    dest: "{{ hive_binary_path }}.old-roll"
    remote_src: true
    mode: "0755"
  when: inventory_hostname != hive_group_build_host

- name: Follower -- atomically move the verified controller into place
  ansible.builtin.command:
    cmd: mv -f /tmp/hive-cloud.new {{ hive_binary_path }}
  when: inventory_hostname != hive_group_build_host

- name: Verify the controller now in place is canonical before restart
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _in_place
  failed_when: >-
    (_in_place.stat.checksum | default('')) !=
    hostvars[hive_group_build_host].hive_group_build_sha256

- name: Install the fail-closed cell-agent release publisher
  ansible.builtin.copy:
    src: "{{ role_path }}/../hive_platform/files/install-cell-agent.sh"
    dest: /usr/local/sbin/hive-install-cell-agent
    owner: root
    group: root
    mode: "0755"

# The helper copies the candidate into the destination filesystem, verifies its
# canonical SHA-256, then bounds and parses the CLI protocol probe. Only after
# that preflight does it rotate .old and atomically rename the new executable.
- name: Preflight and atomically publish the canonical cell agent
  vars:
    _candidate: >-
      {{ hive_cargo_target_dir ~ '/release/hive-cell-agent'
         if inventory_hostname == hive_group_build_host
         else '/tmp/hive-cell-agent.new' }}
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/hive-install-cell-agent
      - "{{ _candidate }}"
      - "{{ hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent') }}"
  environment:
    CELL_AGENT_EXPECTED_SHA256: "{{ hostvars[hive_group_build_host].hive_group_cell_agent_sha256 }}"
    CELL_AGENT_PROTOCOL_EXPECTED: "{{ hive_runtime_artifact_protocol_expected | default(1) | string }}"
    CELL_AGENT_PROTOCOL_TIMEOUT_SECS: "{{ hive_cell_agent_protocol_timeout_seconds | default(5) | string }}"
    CELL_AGENT_RELEASE_FACT: "{{ hive_cell_agent_release_fact_path | default('/usr/local/bin/hive-cell-agent.release.json') }}"
  register: _cell_agent_install
  changed_when: >-
    (_pre_agent_install.stat.checksum | default('')) !=
      hostvars[hive_group_build_host].hive_group_cell_agent_sha256 or
    not (_pre_agent_fact.stat.exists | default(false))

- name: Require the exact parseable installed cell-agent release fact
  vars:
    _fact: "{{ _cell_agent_install.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - _fact.keys() | sort == ['agent_sha256', 'runtime_artifact_protocol', 'schema']
      - (_fact.schema | int) == 1
      - (_fact.runtime_artifact_protocol | int) == (hive_runtime_artifact_protocol_expected | default(1) | int)
      - _fact.agent_sha256 == hostvars[hive_group_build_host].hive_group_cell_agent_sha256
    fail_msg: >-
      {{ hive_name }} did not publish the exact built cell-agent digest and
      runtime-artifact protocol; hive-node remains on its prior running image.

- name: Verify the installed cell-agent bytes and fact metadata before restart
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: "{{ item.checksum }}"
    checksum_algorithm: sha256
  loop:
    - path: "{{ hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent') }}"
      checksum: true
    - path: "{{ hive_cell_agent_release_fact_path | default('/usr/local/bin/hive-cell-agent.release.json') }}"
      checksum: false
  register: _cell_agent_in_place

- name: Refuse restart unless the installed cell-agent package is exact
  vars:
    _agent: "{{ _cell_agent_in_place.results[0].stat }}"
    _fact_file: "{{ _cell_agent_in_place.results[1].stat }}"
  ansible.builtin.assert:
    that:
      - _agent.exists
      - _agent.isreg
      - _agent.pw_name == 'root'
      - _agent.gr_name == 'root'
      - _agent.mode == '0755'
      - _agent.checksum == hostvars[hive_group_build_host].hive_group_cell_agent_sha256
      - _fact_file.exists
      - _fact_file.isreg
      - _fact_file.pw_name == 'root'
      - _fact_file.gr_name == 'root'
      - _fact_file.mode == '0444'
    fail_msg: >-
      {{ hive_name }} has an incomplete or mismatched cell-agent package; refusing
      to restart the controller or allow a later rootfs bake to consume it.

- name: Remove the follower cell-agent staging file after publication
  ansible.builtin.file:
    path: /tmp/hive-cell-agent.new
    state: absent
  when: inventory_hostname != hive_group_build_host

- name: Template the hive-node systemd unit (in case env/vars changed)
  ansible.builtin.template:
    src: "{{ role_path }}/../hive_platform/templates/hive-node.service.j2"
    dest: /etc/systemd/system/hive-node.service
    mode: "0644"
  no_log: true
  diff: false
  register: _unit

# Followers take the pushed cr-sqlite copy; the build host installs from dist.
- name: Install the cr-sqlite extension when its content changed
  ansible.builtin.shell: |
    set -e
    if [ "{{ inventory_hostname }}" = "{{ hive_group_build_host }}" ]; then
      src="{{ hive_src_dir }}/vendor/cr-sqlite/core/dist/crsqlite.so"
    else
      src=/tmp/crsqlite.so.new
    fi
    dst=/var/lib/hive/crsqlite.so
    if [ ! -f "$dst" ] || ! cmp -s "$src" "$dst"; then
      install -m 0755 "$src" "$dst"
    fi
  args:
    executable: /bin/bash

- name: Drop in HIVE_CRSQL_EXTENSION_PATH for hive-node
  ansible.builtin.copy:
    dest: /etc/systemd/system/hive-node.service.d/crsqlite.conf
    mode: "0644"
    content: |
      [Service]
      Environment=HIVE_CRSQL_EXTENSION_PATH=/var/lib/hive/crsqlite.so

- name: Reload systemd if the unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: _unit.changed

- name: Restart hive-node
  ansible.builtin.systemd:
    name: hive-node
    state: restarted
    enabled: true
    daemon_reload: true

- name: Wait for the admin port to answer
  ansible.builtin.uri:
    url: "http://{{ hive_admin }}/v1/mesh"
    method: GET
    status_code: 200
  register: _mesh
  retries: 12
  delay: 5
  until: _mesh.status == 200

- name: Report mesh health
  ansible.builtin.debug:
    msg: "{{ hive_name }}: /v1/mesh -> {{ _mesh.json }}"
