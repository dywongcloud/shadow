---
# Runs SERIALLY (see playbooks/parallel-deploy.yml's serial: on this play) --
# swaps the binary into place (a no-op copy on the build host, an atomic
# mv from the pushed /tmp copy on every follower), restarts hive-node, and
# health-checks before ansible moves to the next batch. One host at a time
# by default so mesh quorum is never lost across more than one node at once
# (AGENTS.md health-verdict-per-observer note; the same reasoning
# playbooks/platform-only.yml's serial: 1 already encodes).

# Gate BEFORE anything is touched. A `--limit` that keeps hosts of a glibc
# group but drops that group's build host builds nothing for them, and without
# this the restart play would happily bounce the service onto whatever binary
# was already there and report ok= -- a deploy-shaped non-event.
- name: Require a canonical artifact for this host's glibc group
  ansible.builtin.assert:
    that:
      - hostvars[hive_group_build_host].hive_group_build_sha256 is defined
      - (hostvars[hive_group_build_host].hive_group_build_sha256 | default('') | length) == 64
    fail_msg: >-
      NOTHING WAS BUILT for glibc group '{{ hive_glibc_group }}' in this run --
      refusing to restart {{ hive_name }} onto an unverified binary. Build host
      for this group: '{{ hive_group_build_host }}'.

- name: Build host -- binary is already canonical, nothing to swap
  ansible.builtin.debug:
    msg: "{{ hive_name }}: build host, binary already at {{ hive_binary_path }}"
  when: inventory_hostname == hive_group_build_host

- name: Follower -- record the binary content BEFORE the swap
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _pre_swap
  when: inventory_hostname != hive_group_build_host

- name: Follower -- publish the pre-swap sha for verification
  ansible.builtin.set_fact:
    hive_pre_deploy_sha: "{{ _pre_swap.stat.checksum | default('') }}"
  when: inventory_hostname != hive_group_build_host

- name: Follower -- back up the running binary before swap
  ansible.builtin.copy:
    src: "{{ hive_binary_path }}"
    dest: "{{ hive_binary_path }}.old-roll"
    remote_src: true
    mode: "0755"
  when: inventory_hostname != hive_group_build_host

- name: Follower -- atomically move the verified pushed binary into place
  ansible.builtin.command:
    cmd: mv -f /tmp/hive-cloud.new {{ hive_binary_path }}
  when: inventory_hostname != hive_group_build_host

# Fail here, BEFORE the restart, if the file in place is not the artifact this
# run built -- restarting onto the wrong binary and discovering it in the
# verification pass costs a service bounce that this check makes unnecessary.
- name: Verify the binary now in place is the canonical build (pre-restart)
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _in_place
  failed_when: >-
    (_in_place.stat.checksum | default('')) !=
    hostvars[hive_group_build_host].hive_group_build_sha256

- name: Template the hive-node systemd unit (in case env/vars changed)
  ansible.builtin.template:
    src: "{{ role_path }}/../hive_platform/templates/hive-node.service.j2"
    dest: /etc/systemd/system/hive-node.service
    mode: "0644"
  register: _unit

# The packaged cr-sqlite extension (build.yml's note names the outage class).
# Followers take the pushed copy; the build host installs from its own dist.
- name: Install the cr-sqlite extension when its content changed
  ansible.builtin.shell: |
    set -e
    if [ "{{ inventory_hostname }}" = "{{ hive_group_build_host }}" ]; then
      src="{{ hive_src_dir }}/vendor/cr-sqlite/core/dist/crsqlite.so"
    else
      src=/tmp/crsqlite.so.new
    fi
    dst=/var/lib/hive/crsqlite.so
    if [ ! -f "$dst" ] || ! cmp -s "$src" "$dst"; then
      install -m 0755 "$src" "$dst"
    fi
  args:
    executable: /bin/bash

- name: Drop in HIVE_CRSQL_EXTENSION_PATH for hive-node
  ansible.builtin.copy:
    dest: /etc/systemd/system/hive-node.service.d/crsqlite.conf
    mode: "0644"
    content: |
      [Service]
      Environment=HIVE_CRSQL_EXTENSION_PATH=/var/lib/hive/crsqlite.so

- name: Reload systemd if the unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: _unit.changed

- name: Restart hive-node
  ansible.builtin.systemd:
    name: hive-node
    state: restarted
    enabled: true
    daemon_reload: true

- name: Wait for the admin port to answer
  ansible.builtin.uri:
    url: "http://{{ hive_admin }}/v1/mesh"
    method: GET
    status_code: 200
  register: _mesh
  retries: 12
  delay: 5
  until: _mesh.status == 200

- name: Report mesh health
  ansible.builtin.debug:
    msg: "{{ hive_name }}: /v1/mesh -> {{ _mesh.json }}"
