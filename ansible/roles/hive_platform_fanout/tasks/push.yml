---
# Runs on followers in parallel. It pushes and verifies the controller+agent
# pair but swaps neither; restart.yml publishes them serially.

- name: Skip push on the build host itself (already has canonical artifacts)
  ansible.builtin.meta: end_host
  when: inventory_hostname == hive_group_build_host

- name: Push the group's canonical controller (compressed) to /tmp
  ansible.builtin.copy:
    src: "{{ hive_artifact_root }}/hive-cloud-{{ hive_glibc_group }}.gz"
    dest: /tmp/hive-cloud.new.gz
    mode: "0644"
  throttle: "{{ hive_push_throttle | default(4) }}"

- name: Push the group's canonical cell agent (compressed) to /tmp
  ansible.builtin.copy:
    src: "{{ hive_artifact_root }}/hive-cell-agent-{{ hive_glibc_group }}.gz"
    dest: /tmp/hive-cell-agent.new.gz
    mode: "0644"
  throttle: "{{ hive_push_throttle | default(4) }}"

- name: Decompress the pushed controller
  ansible.builtin.shell:
    cmd: "gzip -d -f -c /tmp/hive-cloud.new.gz > /tmp/hive-cloud.new && chmod 0755 /tmp/hive-cloud.new"
  changed_when: true

- name: Decompress the pushed cell agent
  ansible.builtin.shell:
    cmd: "gzip -d -f -c /tmp/hive-cell-agent.new.gz > /tmp/hive-cell-agent.new && chmod 0755 /tmp/hive-cell-agent.new"
  changed_when: true

# These compare the executable bytes after decompression with the build host's
# uncompressed SHA-256 facts. A truncated/corrupt transport never reaches the
# serial publication phase.
- name: Verify the pushed controller SHA-256
  ansible.builtin.command:
    cmd: sha256sum /tmp/hive-cloud.new
  register: _pushed_sha
  changed_when: false
  failed_when: >-
    _pushed_sha.stdout.split(' ')[0] !=
    hostvars[hive_group_build_host].hive_group_build_sha256

- name: Verify the pushed cell-agent SHA-256
  ansible.builtin.command:
    cmd: sha256sum /tmp/hive-cell-agent.new
  register: _pushed_agent_sha
  changed_when: false
  failed_when: >-
    _pushed_agent_sha.stdout.split(' ')[0] !=
    hostvars[hive_group_build_host].hive_group_cell_agent_sha256

- name: Remove compressed artifacts from the target
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/hive-cloud.new.gz
    - /tmp/hive-cell-agent.new.gz

# The cr-sqlite extension is small enough to push uncompressed.
- name: Push the group's cr-sqlite extension
  ansible.builtin.copy:
    src: "{{ hive_artifact_root }}/crsqlite-{{ hive_glibc_group }}.so"
    dest: /tmp/crsqlite.so.new
    mode: "0755"
  throttle: "{{ hive_push_throttle | default(4) }}"
