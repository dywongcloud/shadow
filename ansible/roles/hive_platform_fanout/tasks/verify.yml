---
# CONTENT verification for the controller+agent release pair. A backend deploy
# is complete only when hive-node runs the canonical controller and the exact
# canonical cell-agent bytes plus parseable release fact are installed for the
# later manual rootfs bake.

- name: Require canonical controller and cell-agent artifacts for this glibc group
  ansible.builtin.assert:
    that:
      - hostvars[hive_group_build_host].hive_group_build_sha256 is defined
      - (hostvars[hive_group_build_host].hive_group_build_sha256 | default('') | length) == 64
      - hostvars[hive_group_build_host].hive_group_cell_agent_sha256 is defined
      - (hostvars[hive_group_build_host].hive_group_cell_agent_sha256 | default('') | length) == 64
    fail_msg: >-
      The release pair for '{{ hive_glibc_group }}' is incomplete, so
      '{{ hive_name }}' cannot be verified. Include build host
      '{{ hive_group_build_host }}' and rerun the backend release.

- name: Checksum the controller and installed cell agent on disk
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: true
    checksum_algorithm: sha256
  loop:
    - "{{ hive_binary_path }}"
    - "{{ hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent') }}"
  register: _verify_disk_pair

- name: Read the installed cell-agent release fact
  ansible.builtin.slurp:
    src: "{{ hive_cell_agent_release_fact_path | default('/usr/local/bin/hive-cell-agent.release.json') }}"
  register: _verify_agent_fact

- name: Inspect the cell-agent rollback binary
  ansible.builtin.stat:
    path: "{{ (hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent')) ~ '.old' }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _verify_agent_old

# /proc/<pid>/exe is the running controller image, not merely the current path.
- name: Checksum the running controller and read its unit start time
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      pid="$(systemctl show -p MainPID --value hive-node)"
      if [ -z "$pid" ] || [ "$pid" = "0" ]; then
        echo "ERR hive-node has no MainPID (not running)" >&2
        exit 3
      fi
      running="$(sha256sum "/proc/$pid/exe" | cut -d' ' -f1)"
      ts="$(systemctl show -p ExecMainStartTimestamp --value hive-node)"
      if [ -z "$ts" ]; then
        echo "ERR hive-node reports no ExecMainStartTimestamp" >&2
        exit 4
      fi
      printf '%s %s %s\n' "$pid" "$running" "$(date -d "$ts" +%s)"
    executable: /bin/bash
  register: _verify_run
  changed_when: false

- name: Record this host's backend release verification facts
  vars:
    _release: "{{ _verify_agent_fact.content | b64decode | from_json }}"
  ansible.builtin.set_fact:
    hive_verify_backend:
      host: "{{ hive_name }}"
      inventory_host: "{{ inventory_hostname }}"
      glibc_group: "{{ hive_glibc_group }}"
      canonical_sha: "{{ hostvars[hive_group_build_host].hive_group_build_sha256 }}"
      canonical_agent_sha: "{{ hostvars[hive_group_build_host].hive_group_cell_agent_sha256 }}"
      pre_sha: "{{ hive_pre_deploy_sha | default('') }}"
      pre_agent_sha: "{{ hive_pre_agent_sha | default('') }}"
      disk_sha: "{{ _verify_disk_pair.results[0].stat.checksum | default('') }}"
      agent_disk_sha: "{{ _verify_disk_pair.results[1].stat.checksum | default('') }}"
      agent_release_schema: "{{ _release.schema | default(0) | int }}"
      agent_release_protocol: "{{ _release.runtime_artifact_protocol | default(0) | int }}"
      agent_release_sha: "{{ _release.agent_sha256 | default('') }}"
      agent_old_sha: "{{ _verify_agent_old.stat.checksum | default('') }}"
      running_pid: "{{ _verify_run.stdout.split()[0] }}"
      running_sha: "{{ _verify_run.stdout.split()[1] }}"
      started_epoch: "{{ _verify_run.stdout.split()[2] | int }}"
      # A guest-only release is not a no-op merely because controller bytes did
      # not change. Store yes/no strings because non-native Jinja booleans are
      # truthy strings under selectattr.
      content_changed: >-
        {{ 'yes' if
           ((hive_pre_deploy_sha | default('')) != hostvars[hive_group_build_host].hive_group_build_sha256 or
            (hive_pre_agent_sha | default('')) != hostvars[hive_group_build_host].hive_group_cell_agent_sha256)
           else 'no' }}

- name: Assert the on-disk controller is canonical
  ansible.builtin.assert:
    that:
      - hive_verify_backend.disk_sha == hive_verify_backend.canonical_sha
    fail_msg: >-
      {{ hive_name }} controller on disk={{ hive_verify_backend.disk_sha | default('(missing)') }},
      built={{ hive_verify_backend.canonical_sha }}.

- name: Assert the running controller is canonical
  ansible.builtin.assert:
    that:
      - hive_verify_backend.running_sha == hive_verify_backend.canonical_sha
    fail_msg: >-
      {{ hive_name }} hive-node pid {{ hive_verify_backend.running_pid }} runs
      {{ hive_verify_backend.running_sha }}, built={{ hive_verify_backend.canonical_sha }}.

- name: Assert the installed cell agent and release fact are canonical
  ansible.builtin.assert:
    that:
      - hive_verify_backend.agent_disk_sha == hive_verify_backend.canonical_agent_sha
      - hive_verify_backend.agent_release_schema == 2
      - hive_verify_backend.agent_release_protocol == (hive_runtime_artifact_protocol_expected | default(1) | int)
      - hive_verify_backend.agent_release_sha == hive_verify_backend.canonical_agent_sha
    fail_msg: >-
      {{ hive_name }} has an unverified cell-agent package: installed={{ hive_verify_backend.agent_disk_sha }},
      release-fact={{ hive_verify_backend.agent_release_sha }},
      built={{ hive_verify_backend.canonical_agent_sha }},
      schema={{ hive_verify_backend.agent_release_schema }},
      protocol={{ hive_verify_backend.agent_release_protocol }}.

- name: Assert changed agent bytes preserved the exact rollback binary
  ansible.builtin.assert:
    that:
      - >-
        hive_verify_backend.pre_agent_sha == '' or
        hive_verify_backend.pre_agent_sha == hive_verify_backend.canonical_agent_sha or
        hive_verify_backend.agent_old_sha == hive_verify_backend.pre_agent_sha
    fail_msg: >-
      {{ hive_name }} replaced cell-agent {{ hive_verify_backend.pre_agent_sha }}
      without preserving those exact bytes at hive-cell-agent.old
      (observed {{ hive_verify_backend.agent_old_sha | default('(missing)') }}).

- name: Assert hive-node actually restarted during this run
  ansible.builtin.assert:
    that:
      - (hive_verify_backend.started_epoch | int) >= (hive_deploy_epoch | int)
    fail_msg: >-
      {{ hive_name }} hive-node predates this deploy: started
      {{ hive_verify_backend.started_epoch }}, deploy began {{ hive_deploy_epoch }}.
