---
# Runs ONLY on the elected build host for one glibc group (see
# playbooks/parallel-deploy.yml). Syncs source, builds hive-cloud release,
# and packages the resulting binary + its sha256 for fan-out -- mirrors
# scripts/roll-backend-fleet.sh's build() step, but expressed as a role task
# file instead of a bash function so ansible drives the parallel-build /
# serial-restart split.

- name: Ensure the source directory exists on the build host
  ansible.builtin.file:
    path: "{{ hive_src_dir }}"
    state: directory
    mode: "0755"

- name: Sync crates/ (the whole Cargo workspace's source)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../crates/"
    dest: "{{ hive_src_dir }}/crates/"
    delete: true
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"
  register: _synced

# rsync -a preserves local mtimes, so a build that finishes AFTER a sync
# lands can leave cargo fingerprints newer than the fresh sources and
# silently skip rebuilding (AGENTS.md "Fleet-roll gotcha"). Touch whenever
# the sync actually changed anything.
- name: Touch synced sources so cargo cannot skip the rebuild
  ansible.builtin.command:
    cmd: find crates -name "*.rs" -exec touch {} +
    chdir: "{{ hive_src_dir }}"
  when: _synced.changed

- name: Sync vendor/ (patched crates, e.g. guardian-db)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../vendor/"
    dest: "{{ hive_src_dir }}/vendor/"
    delete: true
    rsync_opts:
      - "--exclude=target"
      - "--exclude=tmp"
      - "--exclude=.git"

- name: Copy Cargo.toml + Cargo.lock (workspace manifest, exact-pinned)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item }}"
    dest: "{{ hive_src_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - Cargo.toml
    - Cargo.lock

# The no-op detector's input on the build host: what this host had BEFORE
# cargo ran. Cargo does not rewrite an up-to-date binary, so source that did
# not change yields the SAME sha here and in the canonical artifact -- which is
# exactly how playbooks/parallel-deploy.yml's verification pass tells "deployed
# new code" from "deployed nothing and reported ok=".
- name: Record the binary this host had BEFORE the build
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _pre_build

- name: Publish the pre-build sha for verification
  ansible.builtin.set_fact:
    hive_pre_deploy_sha: "{{ _pre_build.stat.checksum | default('') }}"

# `-p hive-cell-agent` alongside hive-cloud: the agent is the guest's PID1 and
# is a SEPARATE binary that this rollout previously never built, so agent-side
# code could be committed, merged and "rolled out" while no node had it — the
# guest-side NODE_RUNTIME_MISSING preflight added for the Wasmer runtime shipped
# exactly that way, compiled and undelivered. The role next door already names
# this gap ("add `-p hive-cell-agent` to hive_platform's build task if you need
# it here").
#
# Building it does not by itself reach a running guest: the agent is baked INTO
# the rootfs image, so it lands only on the next `build-rootfs.sh` run, which
# reads it from AGENT_BIN=/usr/local/bin/hive-cell-agent. Building + installing
# it here is what makes that rebuild pick up CURRENT code instead of whatever
# bootstrap-guest.sh happened to compile at node bring-up.
- name: Build hive-cloud + hive-cell-agent (release) on the group's build host
  ansible.builtin.command:
    cmd: cargo build --release -p hive-cloud -p hive-cell-agent
    chdir: "{{ hive_src_dir }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
    CARGO_TARGET_DIR: "{{ hive_cargo_target_dir }}"
  async: 1800
  poll: 15

- name: Confirm the binary was produced
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
  register: _bin
  failed_when: not _bin.stat.exists

- name: sha256 the canonical binary
  ansible.builtin.command:
    cmd: "sha256sum {{ hive_binary_path }}"
  register: _sha
  changed_when: false

- name: Set facts for this build host's artifact
  ansible.builtin.set_fact:
    hive_group_build_sha256: "{{ _sha.stdout.split(' ')[0] }}"

# COMPRESS BEFORE IT CROSSES THE OPERATOR'S UPLINK. Every byte of this rollout
# goes through the control host twice — once down on this fetch, then once up
# per target on the push — and both legs are the operator machine's own link.
# push.yml's comment already names that as the residential-uplink problem
# roll-backend-fleet.sh exists to avoid, and throttles the push half; the FETCH
# half had no mitigation at all, and it is the half that hung: a ~117 MiB pull
# from the Bangkok build host sat with the SSH session alive and zero bytes
# landing for over an hour, twice, blocking the whole fleet rollout while the
# Virginia build host's identical fetch completed fine.
#
# Measured, not assumed: gzip -6 on this binary is 3.91x (257 MiB -> 66 MiB on a
# debug build; the release binary is ~117 MiB -> ~30 MiB). That is ~30 MiB down
# and 6x~30 MiB up instead of 117 and 6x117 — the same 4x off both legs, for the
# cost of a few seconds of CPU on hosts that just spent minutes compiling.
#
# The integrity check is UNCHANGED and still covers the real artifact:
# `hive_group_build_sha256` is the sha of the UNCOMPRESSED binary, taken above,
# and push.yml verifies it after decompressing on the target. So compression is
# purely a transport concern and cannot mask a corrupted transfer.
- name: Compress the canonical binary for transport (on the build host)
  ansible.builtin.shell:
    cmd: "gzip -6 -c {{ hive_binary_path }} > {{ hive_binary_path }}.gz"
  changed_when: true

- name: Fetch the COMPRESSED binary to the control host
  ansible.builtin.fetch:
    src: "{{ hive_binary_path }}.gz"
    dest: "{{ hive_artifact_root }}/hive-cloud-{{ hive_glibc_group }}.gz"
    flat: true
