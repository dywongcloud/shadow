---
# Runs only on the elected build host for one glibc group. It builds the
# controller and guest agent from one source snapshot and fetches both exact
# artifacts for fan-out; restart.yml publishes them serially.

- name: Ensure the source directory exists on the build host
  ansible.builtin.file:
    path: "{{ hive_src_dir }}"
    state: directory
    mode: "0755"

- name: Sync crates/ (the whole Cargo workspace's source)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../crates/"
    dest: "{{ hive_src_dir }}/crates/"
    delete: true
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"
  register: _synced

# rsync -a preserves local mtimes, so a build that finishes after a sync lands
# can leave cargo fingerprints newer than the fresh sources and silently skip
# rebuilding. Touch whenever the sync actually changed anything.
- name: Touch synced sources so cargo cannot skip the rebuild
  ansible.builtin.command:
    cmd: find crates -name "*.rs" -exec touch {} +
    chdir: "{{ hive_src_dir }}"
  when: _synced.changed

- name: Sync vendor/ (patched crates, e.g. guardian-db)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../vendor/"
    dest: "{{ hive_src_dir }}/vendor/"
    delete: true
    rsync_opts:
      - "--exclude=target"
      - "--exclude=tmp"
      - "--exclude=.git"

- name: Copy Cargo.toml + Cargo.lock (workspace manifest, exact-pinned)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item }}"
    dest: "{{ hive_src_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - Cargo.toml
    - Cargo.lock

# Record what this host had before Cargo/packaging. The no-op detector must
# count an agent-only release as real content movement even when hive-cloud's
# own bytes happen not to change.
- name: Record the controller this host had before the build
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _pre_build

- name: Record the installed cell-agent this host had before the build
  ansible.builtin.stat:
    path: "{{ hive_cell_agent_install_path | default('/usr/local/bin/hive-cell-agent') }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _pre_agent_build

- name: Publish the pre-build digests for verification
  ansible.builtin.set_fact:
    hive_pre_deploy_sha: "{{ _pre_build.stat.checksum | default('') }}"
    hive_pre_agent_sha: "{{ _pre_agent_build.stat.checksum | default('') }}"

# Cargo overwrites hive_binary_path in place on the build host before the serial
# restart phase. Followers get an .old-roll backup there, so snapshot this host
# first too.
- name: Back up the build host's current controller before cargo overwrites it
  ansible.builtin.copy:
    src: "{{ hive_binary_path }}"
    dest: "{{ hive_binary_path }}.old-roll"
    remote_src: true
    mode: "0755"
  when: _pre_build.stat.exists | default(false)

- name: Build hive-cloud + hive-cell-agent on this glibc lane
  ansible.builtin.command:
    cmd: cargo build --release -p hive-cloud -p hive-cell-agent
    chdir: "{{ hive_src_dir }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
    CARGO_TARGET_DIR: "{{ hive_cargo_target_dir }}"
  async: 1800
  poll: 15

- name: Confirm and checksum the canonical controller
  ansible.builtin.stat:
    path: "{{ hive_binary_path }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: _bin
  failed_when: >-
    not (_bin.stat.exists | default(false)) or
    (_bin.stat.checksum | default('') | length) != 64

- name: Confirm and checksum the canonical cell agent
  ansible.builtin.stat:
    path: "{{ hive_cargo_target_dir }}/release/hive-cell-agent"
    get_checksum: true
    checksum_algorithm: sha256
  register: _agent_bin
  failed_when: >-
    not (_agent_bin.stat.exists | default(false)) or
    not (_agent_bin.stat.isreg | default(false)) or
    (_agent_bin.stat.checksum | default('') | length) != 64

- name: Probe the canonical cell agent's exact protocol fact
  ansible.builtin.command:
    argv:
      - timeout
      - --signal=TERM
      - --kill-after=1s
      - "{{ (hive_cell_agent_protocol_timeout_seconds | default(5) | string) ~ 's' }}"
      - "{{ hive_cargo_target_dir }}/release/hive-cell-agent"
      - --agent-protocol-fact
  register: _agent_protocol_fact
  changed_when: false

- name: Refuse a canonical agent with a mismatched protocol contract
  vars:
    _fact: "{{ _agent_protocol_fact.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - _fact.keys() | sort == ['agent_wire_capabilities', 'agent_wire_protocol', 'rootfs_schema', 'runtime_artifact_protocol']
      - (_fact.rootfs_schema | int) == (hive_runtime_artifact_rootfs_schema_expected | default(2) | int)
      - (_fact.runtime_artifact_protocol | int) == (hive_runtime_artifact_protocol_expected | default(1) | int)
      - (_fact.agent_wire_protocol | int) == (hive_agent_wire_protocol_expected | default(2) | int)
      - (_fact.agent_wire_capabilities | int) == (hive_agent_wire_capabilities_expected | default(31) | int)
    fail_msg: >-
      The glibc lane built a cell agent whose exact rootfs schema,
      runtime-artifact protocol, wire protocol or capability set disagrees with
      the release contract. Nothing from this lane may be fetched or published.

- name: Set facts for this build host's artifact pair
  ansible.builtin.set_fact:
    hive_group_build_sha256: "{{ _bin.stat.checksum }}"
    hive_group_cell_agent_sha256: "{{ _agent_bin.stat.checksum }}"
    hive_group_cell_agent_protocol_fact: "{{ _agent_protocol_fact.stdout | from_json }}"

# Compress before either artifact crosses the operator's uplink. Integrity
# remains over the uncompressed executable bytes and is rechecked after every
# transfer and installation.
- name: Compress the canonical controller for transport
  ansible.builtin.shell:
    cmd: "gzip -6 -c {{ hive_binary_path }} > {{ hive_binary_path }}.gz"
  changed_when: true

- name: Compress the canonical cell agent for transport
  ansible.builtin.shell:
    cmd: >-
      gzip -6 -c {{ hive_cargo_target_dir }}/release/hive-cell-agent >
      {{ hive_cargo_target_dir }}/release/hive-cell-agent.gz
  changed_when: true

- name: Fetch the compressed controller to the control host
  ansible.builtin.fetch:
    src: "{{ hive_binary_path }}.gz"
    dest: "{{ hive_artifact_root }}/hive-cloud-{{ hive_glibc_group }}.gz"
    flat: true

- name: Fetch the compressed cell agent to the control host
  ansible.builtin.fetch:
    src: "{{ hive_cargo_target_dir }}/release/hive-cell-agent.gz"
    dest: "{{ hive_artifact_root }}/hive-cell-agent-{{ hive_glibc_group }}.gz"
    flat: true

# The cr-sqlite extension rides the same fan-out. It is built from the vendored
# pin with the top-level make target and remains per-glibc-group.
- name: Build the cr-sqlite loadable extension on the group's build host
  ansible.builtin.command:
    cmd: make
    chdir: "{{ hive_src_dir }}/vendor/cr-sqlite"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  async: 1800
  poll: 15

- name: Confirm the extension was produced
  ansible.builtin.stat:
    path: "{{ hive_src_dir }}/vendor/cr-sqlite/core/dist/crsqlite.so"
  register: _crsqlite_so
  failed_when: not _crsqlite_so.stat.exists

- name: Fetch the extension to the control host
  ansible.builtin.fetch:
    src: "{{ hive_src_dir }}/vendor/cr-sqlite/core/dist/crsqlite.so"
    dest: "{{ hive_artifact_root }}/crsqlite-{{ hive_glibc_group }}.so"
    flat: true
