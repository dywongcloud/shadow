---
# DNS + TLS ingress via Vercel DNS + ACME DNS-01, matching RUNBOOK.md's
# Phase 0 exactly. Only meaningful on hosts meant to be leader-capable /
# publicly reachable (HIVE_PUBLIC_IP set) -- run this role against the
# whole [platform] group; nodes without a public IP simply never get
# published to DNS (safe no-op from the platform's own side).

- name: Assert this host has a public IP configured (RUNBOOK.md Phase-0 step 4)
  ansible.builtin.assert:
    that: hive_public_ip is defined and hive_public_ip | length > 0
    fail_msg: >-
      hive_public_ip is not set for {{ hive_name }} (inventory hostvar).
      Nodes without it are never published to DNS -- set it explicitly if
      this host should be reachable, or skip this role for internal-only
      nodes.
  when: hive_ingress_enabled | default(true)

# This fleet's convention (roles/prerequisites) is firewalld DISABLED+MASKED --
# scripts/hive-lockdown.sh is the sole firewall, and it never blocks 80/443.
# On such hosts there is nothing to open and the firewalld module hard-fails
# ("firewall is not currently running"), which broke node-join on the first
# fresh node this role ever ran against (fc-saopaulo). Only act when a host
# genuinely runs firewalld (a non-fleet/standalone use of this role).
- name: Check whether firewalld is running (fleet convention is masked -- hive-lockdown.sh is the sole firewall)
  ansible.builtin.command: systemctl is-active firewalld
  register: _firewalld_active
  changed_when: false
  failed_when: false

- name: Open 80/443 (public ingress) -- only on hosts that actually run firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "80/tcp"
    - "443/tcp"
  when: (hive_ingress_enabled | default(true)) and _firewalld_active.stdout == "active"

- name: Ensure the systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/hive-node.service.d
    state: directory
    mode: "0755"

- name: Template the ingress systemd drop-in (RUNBOOK.md Phase-0 step 6)
  ansible.builtin.template:
    src: ingress.conf.j2
    dest: /etc/systemd/system/hive-node.service.d/ingress.conf
    mode: "0644"
  notify: [reload systemd, restart hive-node]
