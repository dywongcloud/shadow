---
# Firecracker on a host with REAL hardware /dev/kvm -- no kernel work needed,
# just install the binary + a guest kernel. The production Hive rootfs is a
# separate, explicitly drained migration owned by hive_platform_rootfs below.

- name: Assert /dev/kvm is present
  ansible.builtin.stat:
    path: /dev/kvm
  register: _devkvm

- name: Fail loudly if this host has no hardware KVM
  ansible.builtin.assert:
    that: _devkvm.stat.exists
    fail_msg: >-
      /dev/kvm is not present on this host. It belongs in the [fc_pvm]
      inventory group (roles/pvm_firecracker), not [fc_kvm].

# A DOWNGRADE MUST NEVER BE SILENT. `copy` below checksums src against dest and
# copies on any difference (force defaults to yes), with no `creates:` guard — so
# whatever `firecracker_version` names simply becomes the installed binary, older
# or newer. That is how a stale pin can walk a node backwards onto a version with
# a known guest->host escape while ansible reports an ordinary `changed` line and
# the operator learns nothing. Fail loudly instead; upgrades still proceed.
- name: Read the firecracker version already installed (if any)
  ansible.builtin.command: /usr/local/bin/firecracker --version
  register: hive_fc_installed
  failed_when: false
  changed_when: false

- name: Refuse to install an OLDER firecracker over a newer one
  vars:
    # `regex_findall` ALWAYS returns a list, empty when nothing matches.
    # `regex_search` with a capture group returns None on no match, and `first`
    # then raises "'NoneType' object is not iterable" — which on a FRESH node
    # (no firecracker installed yet) turned this guard into a provisioning
    # failure instead of an allow. Caught by running the expression against a
    # real empty string, not by reading it.
    _found: "{{ hive_fc_installed.stdout | default('') | regex_findall('[0-9]+[.][0-9]+[.][0-9]+') }}"
    _cur: "{{ _found[0] if (_found | length) > 0 else '' }}"
    _want: "{{ firecracker_version | regex_replace('^v', '') }}"
  ansible.builtin.assert:
    that:
      - _cur == '' or not (_cur is version(_want, '>'))
    fail_msg: >-
      This host already runs firecracker {{ _cur }}, which is NEWER than the
      pinned {{ firecracker_version }}. Installing would DOWNGRADE the
      hypervisor on a multi-tenant host — refusing. Either raise
      firecracker_version in the group_vars for this group, or, if this host
      deliberately runs a fork build that is not an upstream release tag (bkk
      and hk run v1.17.0-dev from DecOperations/firecracker-next), exclude it
      from this role rather than letting the pin clobber it.
    success_msg: "firecracker {{ _cur | default('none', true) }} -> {{ firecracker_version }} is not a downgrade"

- name: Download + install the Firecracker release binary
  ansible.builtin.unarchive:
    src: "https://github.com/firecracker-microvm/firecracker/releases/download/{{ firecracker_version }}/firecracker-{{ firecracker_version }}-{{ firecracker_arch }}.tgz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/release-{{ firecracker_version }}-{{ firecracker_arch }}/firecracker-{{ firecracker_version }}-{{ firecracker_arch }}"

- name: Install firecracker to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/release-{{ firecracker_version }}-{{ firecracker_arch }}/firecracker-{{ firecracker_version }}-{{ firecracker_arch }}"
    dest: /usr/local/bin/firecracker
    mode: "0755"
    remote_src: true

- name: Download the guest kernel
  ansible.builtin.get_url:
    url: "{{ firecracker_kernel_url }}"
    dest: /var/lib/hive/vmlinux
    mode: "0644"

# No bootstrap-vintage agent is ever baked here. Ordinary role runs install the
# builder only; an operator first rolls the controller+agent package, drains the
# node, then opts into the shared migration. The same role is included by PVM.
- name: Install and optionally run the production rootfs migration
  ansible.builtin.include_role:
    name: hive_platform_rootfs
    apply:
      tags:
        - rootfs
        - runtime_rootfs
  tags: [rootfs, runtime_rootfs]
