---
# Firecracker fork with native PVM pagetable support (loopholelabs).
firecracker_repo: "https://github.com/DecOperations/firecracker-next"
firecracker_version: "main"

# PVM kernel base: virt-pvm/linux pvm-612 (6.12.33 with PVM); the patch series is applied on top.
pvm_base_repo: "https://github.com/virt-pvm/linux"
pvm_base_branch: "pvm-612"
pvm_patch_repo: "https://github.com/dywongcloud/pvm-no-fsgsbase-rdtscp"
# IMMUTABLE full 40-char sha, never a branch (git resolves only full object names); keys the
# `.hive_patches_applied` marker.
pvm_patch_branch: "415c6a44913e2e1b5f996959dfe75fb24082a4db"
pvm_patch_dir: "{{ build_root }}/pvm-patches"

# Patches that apply to pvm_base_branch, in order: declared, never globbed (25-patch-series.yml asserts
# this set plus pvm_patch_files_excluded equals the series on disk).
pvm_patch_files:
  - "0001x86pvmvdsogetcpulslfallback.patch"
pvm_patch_files_excluded:
  - "pvm6.12to7.1complete.patch"    # targets torvalds v7.1, not pvm-612
# GNU patch fuzz: `git apply` has zero fuzz and rejects the correct patch on pvm-612; an explicit assert
# checks the patch's EFFECT afterwards.
pvm_patch_fuzz: 3
# The vanilla virt-pvm base guest config; the fallback series changes capability gating, not Kconfig.
pvm_guest_config_url: "https://raw.githubusercontent.com/virt-pvm/misc/main/pvm-guest-6.12.33.config"
# Whether the git clones re-contact their remotes every run; false keeps builds reproducible and lets a
# host that cannot reach github.com finish.
pvm_git_update: false
# The patch repo is exempt: a sha pin only works if the checkout is moved onto it (idempotent for an
# immutable sha).
pvm_patch_git_update: true
# Control-host cache of the guest config, pushed to targets; pre-place a file to provision offline.
pvm_guest_config_cache: "/tmp/pvm-guest-{{ pvm_base_branch }}.config"

# Ubuntu rootfs published by the Firecracker CI (userland is PVM-independent).
rootfs_squashfs_url: "https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.12/x86_64/ubuntu-24.04.squashfs"
rootfs_size: "1G"

build_root: "/root/pvm-build"
host_kernel_src: "{{ build_root }}/host-linux"
guest_kernel_src: "{{ build_root }}/guest-linux"
firecracker_src: "{{ build_root }}/firecracker"
pvm_dir: "/root/pvm"                      # runtime artifacts live here

make_jobs: "{{ ansible_processor_vcpus | default(ansible_processor_cores) | default(4) }}"
host_localversion: "-pvm"                 # host kernel becomes 6.12.33-pvm+
guest_localversion: "-pvmguest"
fc_target: "x86_64-unknown-linux-gnu"     # gnu build => empty seccomp filter, no libseccomp at runtime

pvm_reboot: true
pvm_set_default_kernel: true
# Boot a real microVM to prove the host: OFF by default (an unproven PVM kernel hard-resets the whole host);
# opt in per host at bring-up with -e pvm_run_smoke_test=true.
pvm_run_smoke_test: false

# Per-host opt-out as a whole-role `when:` guard (the role REBOOTS); set in inventory or with -e pvm_skip=true.
pvm_skip: false

vm_vcpus: 2
vm_mem_mib: 1024
vm_tap_dev: "tap0"
vm_host_ip: "172.16.0.1"
vm_guest_ip: "172.16.0.2"
vm_guest_mac: "06:00:AC:10:00:02"         # derives 172.16.0.2 in the CI rootfs
