---
# PVM has hard requirements. Fail loudly NOW rather than after a 30-minute build.

- name: Require x86_64
  ansible.builtin.assert:
    that: ansible_architecture == "x86_64"
    fail_msg: "PVM is x86_64-only (found {{ ansible_architecture }})."

- name: Require a RHEL-family distro (Rocky/Alma/RHEL 10 tested)
  ansible.builtin.assert:
    that: ansible_os_family == "RedHat"
    fail_msg: "This role targets the RHEL family (found {{ ansible_distribution }})."

- name: Read CPU flags
  ansible.builtin.command: grep -m1 '^flags' /proc/cpuinfo
  register: cpuflags
  changed_when: false

- name: Check FSGSBASE / RDTSCP presence (informational only, not a hard requirement)
  ansible.builtin.set_fact:
    _has_fsgsbase: "{{ 'fsgsbase' in cpuflags.stdout }}"
    _has_rdtscp: "{{ 'rdtscp' in cpuflags.stdout }}"

- name: >-
    Note the fallback path this build will use. pvm_linux_repo (see
    defaults/main.yml) is a patch series that converts PVM's historical hard
    FSGSBASE/RDTSCP requirement into soft runtime fallbacks (MSR-based
    GS-base switching, RDTSCP trap-and-emulate, guest FS-base hypercall
    fallback) -- a host missing either feature still boots real Firecracker
    microVMs via PVM, just measurably slower on syscall/fork-heavy paths
    (fork+exec ~4.3x, getpid ~1.7x, per the patch series' own published
    numbers) -- see this role's README for the full table. This is why the
    OLD hard-fail assertion this task used to have is gone: it would
    incorrectly reject hosts this exact kernel source was built to support.
  ansible.builtin.debug:
    msg: >-
      {{ 'FSGSBASE + RDTSCP both present — fast native path.'
         if (_has_fsgsbase and _has_rdtscp)
         else 'FSGSBASE=' + (_has_fsgsbase | string) + ' RDTSCP=' + (_has_rdtscp | string)
              + ' — one or both masked; PVM will use the software fallback path (slower, still functional).' }}

- name: Detect pre-existing /dev/kvm (real KVM present — PVM not strictly needed)
  ansible.builtin.stat:
    path: /dev/kvm
  register: _preexisting_kvm

- name: Note if hardware KVM is already available
  ansible.builtin.debug:
    msg: "Note: /dev/kvm already exists; this host may have real KVM and not need PVM."
  when: _preexisting_kvm.stat.exists

- name: Read the currently running kernel release
  ansible.builtin.command: uname -r
  register: _running_kernel
  changed_when: false

# Idempotency guard: a re-run of this role on a host that ALREADY booted a
# PVM-built kernel (running release ends in the host_localversion suffix,
# e.g. "-pvm") must never re-attempt the host/guest kernel build. Doing so
# is unsafe, not just wasteful: /boot/config-$(uname -r) at that point reads
# back the ALREADY-PVM-PATCHED kernel's own config (self-referential), which
# live-broke on fc-sanjose-2's idempotency test (pvm_para.h C90/u64 compile
# errors during a re-configure) -- the correct config source (the plain
# distro kernel's config) only exists BEFORE the first PVM boot. Once
# `/dev/kvm` is confirmed present under an already-`-pvm` release, this node
# is fully provisioned; 30/40/50/60 become no-ops.
- name: Set pvm_already_provisioned fact
  ansible.builtin.set_fact:
    # Substring, not endswith: a dirty/untagged kernel tree build appends a
    # trailing "+" (e.g. "6.12.33-pvm+"), which endswith("-pvm") would miss.
    pvm_already_provisioned: "{{ _preexisting_kvm.stat.exists and host_localversion in _running_kernel.stdout }}"

- name: Note PVM is already provisioned (skipping build/install/reboot)
  ansible.builtin.debug:
    msg: "Running kernel '{{ _running_kernel.stdout }}' already carries PVM and /dev/kvm is present -- skipping the host/guest kernel build entirely (safe re-run)."
  when: pvm_already_provisioned

- name: Ensure working directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ build_root }}"
    - "{{ pvm_dir }}"
