---
# Build the PVM-aware Firecracker. Unlike the previous generic-fork-plus-
# hand-patches approach, firecracker_repo (see defaults/main.yml) ALREADY
# carries native PVM pagetable support as a first-class feature -- verified
# by fetching its actual source: src/vmm/src/arch/x86_64/vcpu.rs's own
# set_tsc_khz() is already a documented no-op ("Disable TSC scaling when
# using PVM because it is unsupported on most virtualized platforms"), and
# src/vmm/src/cpu_config/x86_64/custom_cpu_template.rs's CPU-model
# compatibility check is already commented out natively ("Disable the CPU
# compatibility check to allow using templates like T2A on more modern
# CPUs"). The two source patches this role used to re-apply against a
# generic fork are therefore dead code against THIS fork and have been
# removed rather than kept as silent no-ops.

- name: Install rustup + toolchain (user-space, no root toolchain needed)
  ansible.builtin.shell: |
    set -e
    curl -sSf --proto '=https' --tlsv1.2 https://sh.rustup.rs -o /tmp/rustup-init.sh
    sh /tmp/rustup-init.sh -y --default-toolchain stable --profile minimal
  args:
    creates: "{{ ansible_env.HOME }}/.cargo/bin/cargo"

- name: Clone the Firecracker fork
  ansible.builtin.git:
    repo: "{{ firecracker_repo }}"
    dest: "{{ firecracker_src }}"
    version: "{{ firecracker_version }}"
    depth: 1
    single_branch: true
    force: false
    update: "{{ pvm_git_update | bool }}"

# A gnu-target build has no matching seccomp JSON, so Firecracker's build.rs
# falls back to an empty filter automatically (no libseccomp at runtime).
- name: Build Firecracker + jailer ({{ fc_target }}, release)
  ansible.builtin.command:
    cmd: cargo build --release --target {{ fc_target }} --package firecracker --package jailer
    chdir: "{{ firecracker_src }}"
    creates: "{{ firecracker_src }}/build/cargo_target/{{ fc_target }}/release/firecracker"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
    CARGO_TERM_PROGRESS_WHEN: "never"
  async: 1800
  poll: 20

- name: Install firecracker + jailer binaries
  ansible.builtin.copy:
    src: "{{ firecracker_src }}/build/cargo_target/{{ fc_target }}/release/{{ item }}"
    dest: "{{ pvm_dir }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop:
    - firecracker
    - jailer

- name: Symlink firecracker into PATH
  ansible.builtin.file:
    src: "{{ pvm_dir }}/firecracker"
    dest: /usr/local/bin/firecracker
    state: link
