---
# gVisor runsc is PINNED (never `release/latest`): to bump, change hive_runsc_version and replace the matching checksum with the one gVisor publishes
# (https://storage.googleapis.com/gvisor/releases/release/<ver>/<arch>/runsc.sha512); the install task's `force: true` reinstalls on a version change and the checksum makes that safe.
hive_runsc_version: "20260727.0"

# keyed by ansible_architecture: an unlisted arch fails the task loudly (add the arch before adding a node of that arch)
hive_runsc_sha512:
  x86_64: "ab99ea1b0e2d169ec95473ea6c44abdac9b6b63d9c483f898487fd2b3c32d63bfa9ea104a3d5eed217b90cfc880ceb7a1130a9f7daef6e50656b6e028a8f52e3"

# Strict inbound lockdown (default-deny on the internet-facing interface; see
# scripts/hive-lockdown.sh). Opt-in per host in the inventory.
hive_lockdown_strict: false

# Cockpit off, loose rp_filter, sshd hardening drop-in. Safe on every node.
hive_host_hardening: true
