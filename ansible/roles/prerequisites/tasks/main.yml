---

- name: "Assert a dnf-based distro (matches the current fleet: TencentOS/Rocky 10)"
  ansible.builtin.assert:
    that: ansible_pkg_mgr == "dnf"
    fail_msg: >-
      This role's package tasks are dnf-based. The fleet this repo was built
      from runs TencentOS Server / Rocky Linux 10 (both dnf). Porting to
      Debian/Ubuntu means swapping this task file's `dnf:` module for `apt:`
      with the Debian-named equivalents of the same packages -- no other
      role depends on the package manager.

- name: Install base + build + runtime packages
  ansible.builtin.dnf:
    name:
      - gcc
      - gcc-c++
      - make
      - git
      - curl
      - wget
      - rsync
      - tar
      - unzip
      - podman
      - policycoreutils-python-utils   # semanage, for podman/SELinux interplay
      - jq
      - clang-devel
    state: present

- name: Disable + mask firewalld (hive-lockdown.sh is the sole firewall)
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
    masked: true
  failed_when: false   # some images never had it installed at all

- name: Install hive-lockdown.sh
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/hive-lockdown.sh"
    dest: /usr/local/sbin/hive-lockdown.sh
    mode: "0755"
  tags: [lockdown]

- name: Install hive-lockdown.service
  ansible.builtin.copy:
    dest: /etc/systemd/system/hive-lockdown.service
    mode: "0644"
    content: |
      [Unit]
      Description=Hive node public-port lockdown (block 8787/9090/etc from the internet)
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/hive-lockdown.sh
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
  tags: [lockdown]

- name: /etc/hive exists (holds the strict-lockdown flag)
  ansible.builtin.file:
    path: /etc/hive
    state: directory
    mode: "0755"
  tags: [lockdown]

- name: Strict inbound lockdown flag (hive_lockdown_strict; see scripts/hive-lockdown.sh)
  ansible.builtin.file:
    path: /etc/hive/lockdown-strict
    state: "{{ 'touch' if hive_lockdown_strict | bool else 'absent' }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  tags: [lockdown]

- name: Enable + run hive-lockdown now
  ansible.builtin.systemd:
    name: hive-lockdown
    state: restarted
    enabled: true
    daemon_reload: true
  tags: [lockdown]

- name: Disable + mask Cockpit (web console with root password login)
  ansible.builtin.systemd:
    name: cockpit.socket
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  when: hive_host_hardening | bool
  tags: [hardening]

- name: Reverse-path filtering (loose)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-hive-hardening.conf
    mode: "0644"
    content: |
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2
  register: hive_hardening_sysctl
  when: hive_host_hardening | bool
  tags: [hardening]

- name: Apply hardening sysctls
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-hive-hardening.conf
  when: hive_host_hardening | bool and hive_hardening_sysctl is changed
  tags: [hardening]

- name: Mesh UDP socket buffer ceiling
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-hive-udp.conf
    mode: "0644"
    content: |
      net.core.rmem_max = 8388608
      net.core.wmem_max = 8388608
      net.core.netdev_max_backlog = 5000
  register: hive_udp_sysctl
  tags: [hardening]

- name: Apply the mesh UDP buffer sysctls
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-hive-udp.conf
  when: hive_udp_sysctl is changed
  tags: [hardening]

- name: sshd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hive-hardening.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      X11Forwarding no
      GSSAPIAuthentication no
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
  register: hive_sshd_hardening
  when: hive_host_hardening | bool
  tags: [hardening]

- name: Verify sshd picked up the hardening (fail loud if an earlier drop-in wins)
  ansible.builtin.shell: |
    set -e
    out="$(sshd -T)"
    echo "$out" | grep -qx 'permitrootlogin without-password' || echo "$out" | grep -qx 'permitrootlogin prohibit-password'
    echo "$out" | grep -qx 'passwordauthentication no'
    echo "$out" | grep -qx 'x11forwarding no'
  changed_when: false
  when: hive_host_hardening | bool
  tags: [hardening]

- name: Reload sshd (existing sessions survive a reload)
  ansible.builtin.systemd:
    name: sshd
    state: reloaded
  when: hive_host_hardening | bool and hive_sshd_hardening is changed
  tags: [hardening]

- name: Create hive data + run directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ hive_data_dir }}"
    - "/var/lib/hive/rootfs"
    - "/run/hive"

- name: Install rustup + stable toolchain (root, for cargo build --release)
  ansible.builtin.shell: |
    set -e
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
    sh /tmp/rustup-init.sh -y --default-toolchain stable --profile minimal
  args:
    creates: "{{ ansible_env.HOME }}/.cargo/bin/cargo"

- name: git safe.directory '*' (root building a cloned/synced repo)
  community.general.git_config:
    name: safe.directory
    scope: system
    value: "*"

- name: Install Node.js LTS (needed by hive-cloud's own build/deploy pipeline for tenant apps, and for the dashboard build)
  ansible.builtin.dnf:
    name: nodejs
    state: present

- name: Check whether the installed node has node:sqlite (>= 22.5)
  ansible.builtin.command: node -e "require('node:sqlite')"
  register: hive_node_sqlite_check
  failed_when: false
  changed_when: false

- name: Install Node v22.23.2 from the official tarball (sha256-verified) when node:sqlite is missing
  when: hive_node_sqlite_check.rc != 0
  block:
    - name: Download node v22.23.2 tarball with checksum
      ansible.builtin.get_url:
        url: "https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz"
        dest: /tmp/node-v22.23.2-linux-x64.tar.xz
        checksum: "sha256:d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307"

    - name: Extract node v22.23.2 into /usr/local
      ansible.builtin.unarchive:
        src: /tmp/node-v22.23.2-linux-x64.tar.xz
        dest: /usr/local
        remote_src: true
        creates: /usr/local/node-v22.23.2-linux-x64/bin/node

    - name: Symlink node/npm/npx into /usr/local/bin (precedes /usr/bin in default PATH and hive-ui's Environment PATH)
      ansible.builtin.file:
        src: "/usr/local/node-v22.23.2-linux-x64/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - node
        - npm
        - npx

    - name: Remove the tarball
      ansible.builtin.file:
        path: /tmp/node-v22.23.2-linux-x64.tar.xz
        state: absent

    - name: Verify node:sqlite is now loadable
      ansible.builtin.command: /usr/local/bin/node -e "require('node:sqlite')"

- name: Check whether wasmer v7.2.1 is already installed
  ansible.builtin.command: /usr/local/bin/wasmer --version
  register: hive_wasmer_check
  failed_when: false
  changed_when: false

- name: Install Wasmer v7.2.1 from the official release tarball (sha256-verified)
  when: hive_wasmer_check.rc != 0 or hive_wasmer_check.stdout.strip() != 'wasmer 7.2.1'
  block:
    - name: Download wasmer v7.2.1 linux-amd64 tarball with checksum
      ansible.builtin.get_url:
        url: "https://github.com/wasmerio/wasmer/releases/download/v7.2.1/wasmer-linux-amd64.tar.gz"
        dest: /tmp/wasmer-v7.2.1-linux-amd64.tar.gz
        checksum: "sha256:c46d6ff34a12b40d2e57bfc2ccbb8b9e209b0987ab305233619798b264a6bae5"

    - name: Create versioned install dir /usr/local/wasmer-v7.2.1
      ansible.builtin.file:
        path: /usr/local/wasmer-v7.2.1/bin
        state: directory
        mode: "0755"

    - name: Extract only bin/wasmer from the v7.2.1 tarball
      ansible.builtin.unarchive:
        src: /tmp/wasmer-v7.2.1-linux-amd64.tar.gz
        dest: /usr/local/wasmer-v7.2.1
        remote_src: true
        extra_opts:
          - "bin/wasmer"
        creates: /usr/local/wasmer-v7.2.1/bin/wasmer

    - name: Symlink wasmer into /usr/local/bin
      ansible.builtin.file:
        src: /usr/local/wasmer-v7.2.1/bin/wasmer
        dest: /usr/local/bin/wasmer
        state: link
        force: true

    - name: Remove the tarball
      ansible.builtin.file:
        path: /tmp/wasmer-v7.2.1-linux-amd64.tar.gz
        state: absent

    - name: Verify wasmer is now runnable
      ansible.builtin.command: /usr/local/bin/wasmer --version

- name: Check whether bun v1.4.0 is already installed
  ansible.builtin.command: /usr/local/bin/bun --version
  register: hive_bun_check
  failed_when: false
  changed_when: false

- name: Install bun v1.4.0 from the official release (sha256-verified)
  when: hive_bun_check.rc != 0 or hive_bun_check.stdout.strip() != '1.4.0'
  block:
    - name: Detect AVX2 on the managed host (selects the bun asset variant)
      ansible.builtin.command: grep -qw avx2 /proc/cpuinfo
      register: hive_bun_avx2
      failed_when: false
      changed_when: false

    - name: Select the bun asset for this CPU (baseline when AVX2 is absent)
      ansible.builtin.set_fact:
        hive_bun_asset: "{{ 'bun-linux-x64' if hive_bun_avx2.rc == 0 else 'bun-linux-x64-baseline' }}"
        hive_bun_sha256: "{{ '2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452' if hive_bun_avx2.rc == 0 else '184fb4595f0d401a217cf7c78c1bc430ba83314dab7a8b94805babbf7fa7097f' }}"

    - name: Download bun v1.4.0 archive with checksum
      ansible.builtin.get_url:
        url: "https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/{{ hive_bun_asset }}.zip"
        dest: "/tmp/{{ hive_bun_asset }}-v1.4.0.zip"
        checksum: "sha256:{{ hive_bun_sha256 }}"
        force: true

    - name: Create versioned install dir /usr/local/bun-v1.4.0
      ansible.builtin.file:
        path: "/usr/local/bun-v1.4.0/{{ hive_bun_asset }}"
        state: directory
        mode: "0755"

    - name: Extract bun from the v1.4.0 archive into /usr/local/bun-v1.4.0
      ansible.builtin.unarchive:
        src: "/tmp/{{ hive_bun_asset }}-v1.4.0.zip"
        dest: /usr/local/bun-v1.4.0
        remote_src: true
        creates: "/usr/local/bun-v1.4.0/{{ hive_bun_asset }}/bun"

    - name: Symlink bun + bunx into /usr/local/bin (on hive-node.service's Environment PATH)
      ansible.builtin.file:
        src: "/usr/local/bun-v1.4.0/{{ hive_bun_asset }}/bun"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - bun
        - bunx

    - name: Remove the archive
      ansible.builtin.file:
        path: "/tmp/{{ hive_bun_asset }}-v1.4.0.zip"
        state: absent

    - name: Verify bun is now runnable
      ansible.builtin.command: /usr/local/bin/bun --version

- name: Check whether pnpm and yarn are already installed
  ansible.builtin.command: "{{ item.tool }} --version"
  register: hive_npm_pm_check
  failed_when: false
  changed_when: false
  loop:
    - { tool: pnpm, pkg: "pnpm@12.6.0" }
    - { tool: yarn, pkg: "yarn@1.22.22" }

- name: Install the missing package manager into the global npm prefix
  when: item.rc != 0
  ansible.builtin.command: "npm install -g --prefix /usr/local {{ item.item.pkg }}"
  loop: "{{ hive_npm_pm_check.results }}"
  loop_control:
    label: "{{ item.item.tool }}"

- name: Verify pnpm and yarn are now runnable
  ansible.builtin.command: "{{ item }} --version"
  changed_when: false
  loop:
    - pnpm
    - yarn

- name: podman socket enabled (git.rs / sandboxes_platform.rs shell out to podman directly, not via the socket, but keep it available for tooling)
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true

- name: Install gVisor runsc (the container runtime the fleet's HIVE_CONTAINER_RUNTIME=runsc needs)
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/gvisor/releases/release/{{ hive_runsc_version }}/{{ ansible_architecture }}/runsc"
    dest: /usr/local/bin/runsc
    mode: "0755"
    force: true
    checksum: "sha512:{{ hive_runsc_sha512[ansible_architecture] }}"

- name: Register runsc as a podman runtime
  ansible.builtin.blockinfile:
    path: /etc/containers/containers.conf
    create: true
    marker: "# {mark} ANSIBLE MANAGED gvisor runtime"
    block: |
      [engine.runtimes]
      runsc = ["/usr/local/bin/runsc"]
