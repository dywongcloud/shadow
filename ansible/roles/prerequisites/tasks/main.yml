---
# Base OS packages, Rust toolchain, container runtime, and the handful of
# host settings every hive-cloud node needs regardless of KVM/PVM flavor.
# Idempotent throughout -- safe to re-run.

- name: "Assert a dnf-based distro (matches the current fleet: TencentOS/Rocky 10)"
  ansible.builtin.assert:
    # ansible_pkg_mgr, not ansible_os_family: TencentOS Server reports
    # os_family as the literal string "TencentOS Server", not "RedHat" --
    # ansible's fact-gathering doesn't classify it into the RedHat bucket
    # even though it's dnf-based and RHEL-app-compatible enough to run every
    # task in this role. Live-witnessed this assert never actually firing
    # against a TencentOS node in this fleet's history (it's been here since
    # the very first ansible commit) because every current TencentOS node
    # was hand-provisioned before this role ever ran against it -- the first
    # real run, mid this-session, would have failed outright on a distro
    # this role has run dnf against successfully all along. pkg_mgr is also
    # more directly meaningful here than any os-family label: this role's
    # own tasks are dnf-based, so "is dnf the package manager" is exactly
    # the question that matters.
    that: ansible_pkg_mgr == "dnf"
    fail_msg: >-
      This role's package tasks are dnf-based. The fleet this repo was built
      from runs TencentOS Server / Rocky Linux 10 (both dnf). Porting to
      Debian/Ubuntu means swapping this task file's `dnf:` module for `apt:`
      with the Debian-named equivalents of the same packages -- no other
      role depends on the package manager.

- name: Install base + build + runtime packages
  ansible.builtin.dnf:
    name:
      - gcc
      - gcc-c++
      - make
      - git
      - curl
      - wget
      - rsync
      - tar
      - unzip
      - podman
      - policycoreutils-python-utils   # semanage, for podman/SELinux interplay
      - jq
    state: present

# The fleet's SOLE firewall is scripts/hive-lockdown.sh's own iptables/nft
# chain (see that script's header) -- `firewalld` must be disabled+masked,
# never enabled. It runs an independent netfilter layer whose restrictive
# default zone (80/443/ssh only) silently blocks ports hive-lockdown.sh
# explicitly allows for peers. Live-witnessed on fc-sanjose-2: a fresh
# Rocky 10 image ships firewalld ACTIVE by default, which blocked the
# relay/discovery ports from every other fleet node until disabled here --
# the confirmed fleet convention (sj/bkk/va) is firewalld inactive+disabled.
- name: Disable + mask firewalld (hive-lockdown.sh is the sole firewall)
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
    masked: true
  failed_when: false   # some images (e.g. bkk's TencentOS) never had it installed at all

# Single canonical source in scripts/ -- this role used to carry its own
# hand-mirrored copy under files/, and its PEERS roster silently drifted from
# scripts/hive-lockdown.sh's (6 of 12 current nodes). Regenerate the PEERS
# list via scripts/gen-hive-lockdown.sh before running this role; never
# hand-edit a second copy.
- name: Install hive-lockdown.sh
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/hive-lockdown.sh"
    dest: /usr/local/sbin/hive-lockdown.sh
    mode: "0755"

- name: Install hive-lockdown.service
  ansible.builtin.copy:
    dest: /etc/systemd/system/hive-lockdown.service
    mode: "0644"
    content: |
      [Unit]
      Description=Hive node public-port lockdown (block 8787/9090/etc from the internet)
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/hive-lockdown.sh
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target

- name: Enable + run hive-lockdown now
  ansible.builtin.systemd:
    name: hive-lockdown
    state: restarted
    enabled: true
    daemon_reload: true

- name: Create hive data + run directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ hive_data_dir }}"
    - "/var/lib/hive/rootfs"
    - "/run/hive"

- name: Install rustup + stable toolchain (root, for cargo build --release)
  ansible.builtin.shell: |
    set -e
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
    sh /tmp/rustup-init.sh -y --default-toolchain stable --profile minimal
  args:
    creates: "{{ ansible_env.HOME }}/.cargo/bin/cargo"

- name: git safe.directory '*' (root building a cloned/synced repo)
  community.general.git_config:
    name: safe.directory
    scope: system
    value: "*"

- name: Install Node.js LTS (needed by hive-cloud's own build/deploy pipeline for tenant apps, and for the dashboard build)
  ansible.builtin.dnf:
    name: nodejs
    state: present

# Node >= 22.5 floor: the @workflow/web console server build (dashboard /wfc)
# requires node:sqlite, which dnf's nodejs (20 on TencentOS) does not have —
# a v20 node 500s every console request with ERR_UNKNOWN_BUILTIN_MODULE
# (live-witnessed fleet-wide 2026-07-29 on the six TencentOS/CVM nodes, fixed
# by hand with exactly this tarball). deploy-ui-fleet.sh's preflight floors
# this too, but a reprovisioned node would serve the broken console BEFORE
# the next UI deploy, so the floor belongs in provisioning. Idempotent: the
# check skips entirely when the installed node already has node:sqlite.
- name: Check whether the installed node has node:sqlite (>= 22.5)
  ansible.builtin.command: node -e "require('node:sqlite')"
  register: hive_node_sqlite_check
  failed_when: false
  changed_when: false

- name: Install Node v22.23.2 from the official tarball (sha256-verified) when node:sqlite is missing
  when: hive_node_sqlite_check.rc != 0
  block:
    - name: Download node v22.23.2 tarball with checksum
      ansible.builtin.get_url:
        url: "https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz"
        dest: /tmp/node-v22.23.2-linux-x64.tar.xz
        checksum: "sha256:d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307"

    - name: Extract node v22.23.2 into /usr/local
      ansible.builtin.unarchive:
        src: /tmp/node-v22.23.2-linux-x64.tar.xz
        dest: /usr/local
        remote_src: true
        creates: /usr/local/node-v22.23.2-linux-x64/bin/node

    - name: Symlink node/npm/npx into /usr/local/bin (precedes /usr/bin in default PATH and hive-ui's Environment PATH)
      ansible.builtin.file:
        src: "/usr/local/node-v22.23.2-linux-x64/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - node
        - npm
        - npx

    - name: Remove the tarball
      ansible.builtin.file:
        path: /tmp/node-v22.23.2-linux-x64.tar.xz
        state: absent

    - name: Verify node:sqlite is now loadable
      ansible.builtin.command: /usr/local/bin/node -e "require('node:sqlite')"

# Wasmer (hive_core::Runtime::Wasmer): `wasmer run --net --forward-host-env
# <entry>.wasm` is the start_cmd the build pipeline emits for an explicit
# `runtime: "wasmer"` function (see git.rs's detect_wasmer_start_cmd).
#
# WHERE THIS BINARY IS USEFUL, PRECISELY — this distinction is the whole
# reason the feature's first cut was broken. A cell's `start_cmd` is exec'd
# against DIFFERENT filesystems depending on the backend:
#   * mock / litebox — spawned on the HOST, so this install is what runs.
#   * firecracker    — `hive-cell-agent` runs as PID1 INSIDE the microVM and
#                      execs against the GUEST rootfs, where this host install
#                      is completely invisible. Those nodes need wasmer baked
#                      into the rootfs IMAGE instead; see
#                      `ansible/roles/firecracker_kvm` (`hive_wasmer_in_rootfs`)
#                      and `scripts/build-rootfs.sh`'s WASMER_TARBALL.
# A node only advertises `NodeInfo::wasm_runtime` when the probe finds wasmer
# on the filesystem that node actually execs against (hive-cloud's
# `detect_wasm_runtime`), and placement hard-filters on it — so a node missing
# it is simply never chosen, rather than failing every cold start.
#
# Live-verified end-to-end on this exact pinned version: a real axum+tokio
# server built with `cargo wasix build --release` (target wasm32-wasmer-wasi)
# bound a real socket and served a real HTTP request under `wasmer run --net`,
# with `--forward-host-env` correctly carrying the dynamically-assigned $PORT
# into the guest.
#
# DISK: only `bin/wasmer` is installed — 200 MiB. The full tarball extracts to
# 861 MiB, but 560 MiB of that is `lib/libwasmer*.a` static archives for
# EMBEDDING wasmer in another program, which `wasmer run` never opens. Given
# AGENTS.md's "Storage capacity & placement" incident (fc-sanjose reached 0
# bytes free and took 9 customer deployments down), shipping 660 MiB of unused
# artifacts to every node is not a rounding error.
- name: Check whether wasmer v7.2.1 is already installed
  ansible.builtin.command: /usr/local/bin/wasmer --version
  register: hive_wasmer_check
  failed_when: false
  changed_when: false

# Exact-version test, NOT a substring: `'wasmer 7.2.1' not in stdout` would
# also accept a future `wasmer 7.2.10` and silently skip the install.
- name: Install Wasmer v7.2.1 from the official release tarball (sha256-verified)
  when: hive_wasmer_check.rc != 0 or hive_wasmer_check.stdout.strip() != 'wasmer 7.2.1'
  block:
    - name: Download wasmer v7.2.1 linux-amd64 tarball with checksum
      ansible.builtin.get_url:
        url: "https://github.com/wasmerio/wasmer/releases/download/v7.2.1/wasmer-linux-amd64.tar.gz"
        dest: /tmp/wasmer-v7.2.1-linux-amd64.tar.gz
        checksum: "sha256:c46d6ff34a12b40d2e57bfc2ccbb8b9e209b0987ab305233619798b264a6bae5"

    - name: Create versioned install dir /usr/local/wasmer-v7.2.1
      ansible.builtin.file:
        path: /usr/local/wasmer-v7.2.1/bin
        state: directory
        mode: "0755"

    # `extra_opts` limits extraction to the CLI only (see the DISK note above).
    - name: Extract only bin/wasmer from the v7.2.1 tarball
      ansible.builtin.unarchive:
        src: /tmp/wasmer-v7.2.1-linux-amd64.tar.gz
        dest: /usr/local/wasmer-v7.2.1
        remote_src: true
        extra_opts:
          - "bin/wasmer"
        creates: /usr/local/wasmer-v7.2.1/bin/wasmer

    - name: Symlink wasmer into /usr/local/bin
      ansible.builtin.file:
        src: /usr/local/wasmer-v7.2.1/bin/wasmer
        dest: /usr/local/bin/wasmer
        state: link
        force: true

    - name: Remove the tarball
      ansible.builtin.file:
        path: /tmp/wasmer-v7.2.1-linux-amd64.tar.gz
        state: absent

    - name: Verify wasmer is now runnable
      ansible.builtin.command: /usr/local/bin/wasmer --version

- name: podman socket enabled (git.rs / sandboxes_platform.rs shell out to podman directly, not via the socket, but keep it available for tooling)
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true

# The fleet runs container/DB deployments under gVisor (HIVE_CONTAINER_RUNTIME=
# runsc) for stronger isolation than plain runc. Without runsc installed, every
# container/DB deployment fails at launch -- discovered live on a fresh node
# that had the runsc env set but no gVisor binary. Install + register it with
# podman so the runsc runtime the node is configured for actually exists.
- name: Install gVisor runsc (the container runtime the fleet's HIVE_CONTAINER_RUNTIME=runsc needs)
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/gvisor/releases/release/latest/{{ ansible_architecture }}/runsc"
    dest: /usr/local/bin/runsc
    mode: "0755"

- name: Register runsc as a podman runtime
  ansible.builtin.blockinfile:
    path: /etc/containers/containers.conf
    create: true
    marker: "# {mark} ANSIBLE MANAGED gvisor runtime"
    block: |
      [engine.runtimes]
      runsc = ["/usr/local/bin/runsc"]
