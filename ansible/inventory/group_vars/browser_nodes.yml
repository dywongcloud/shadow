---
# Fleet decisions for [browser_nodes] (playbooks/browser-nodes.yml); the role's own defaults live in roles/hive_browser_node/defaults/main.yml.

# also read by the verify play, which runs outside the role where role defaults are not in scope
hive_browser_node_port: 3009

# tenant whose browser-eligible deployments these nodes serve ("personal" = the owner's namespace); run the verify step with the matching team
hive_browser_node_team: personal

# "auto": the fleet derives this tenant's whole browser-eligible set on every renewal (server-side, browser_admission.rs validate_request)
hive_browser_node_serve_mode: auto

# team scope only: a fleet-run node mints role "member", which can never hold a public-scope admission
hive_browser_node_scope: team

# https :3343 relay hostnames only: the relays serve TLS with a wildcard certificate, so an IP literal fails verification
hive_browser_node_relays: >-
  https://fc-sanjose.relay.shadw.app:3343,https://fc-bangkok.relay.shadw.app:3343,https://fc-virginia.relay.shadw.app:3343
