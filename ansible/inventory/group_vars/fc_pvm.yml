---
# Vars specific to hosts WITHOUT hardware KVM, run via PVM. See
# roles/pvm_firecracker (imported from the existing, independently-tested
# pvm-firecracker-ansible role) for the build pipeline these drive.
hive_container_runtime: "runsc"   # gVisor -- the fleet's convention on PVM hosts (podman --runtime runsc)
hive_fc_boot_args: >-
  console=ttyS0 reboot=k panic=1 pci=off i8042.noaux i8042.nomux
  i8042.nopnp i8042.dumbkbd root=/dev/vda rw init=/sbin/hive-cell-agent
# PVM guest kernels are NOT portable across VMs (a kernel built on one PVM
# host triple-faults on another, even an identical-looking one) -- see
# roles/pvm_firecracker/README.md. Every fc_pvm host in inventory gets its
# own from-source kernel build; nokaslr is required in hive_fc_boot_args on
# some PVM versions -- add it here per-host in hosts.ini if a host needs it
# (KASLR + PVM can be incompatible on some kernel/firecracker combinations).
