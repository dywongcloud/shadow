<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lakebed Todo · shadw</title>
    <style>
      :root { color-scheme: light dark; --fg: #0a0a0a; --bg: #fafafa; --muted: #666; --border: #e5e5e5; --card: #fff; }
      @media (prefers-color-scheme: dark) { :root { --fg: #ededed; --bg: #0a0a0a; --muted: #a1a1a1; --border: #262626; --card: #111; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
      main { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
      h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
      .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
      form { display: flex; gap: 8px; }
      input[type=text] { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
      button { padding: 9px 14px; border: 1px solid var(--fg); border-radius: 6px; background: var(--fg); color: var(--bg); font: inherit; font-weight: 500; cursor: pointer; }
      button.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
      li:first-child { border-top: 0; }
      li span.text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      li.done span.text { color: var(--muted); text-decoration: line-through; }
      .meta { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 12px; }
      .error { color: #b91c1c; font-size: 12px; margin-top: 10px; }
      code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
      p.note { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">Framework template</div>
          <h1>Lakebed Todo</h1>
        </div>
        <a class="eyebrow" href="/api/health">health</a>
      </header>

      <div class="card">
        <form id="add">
          <input id="text" type="text" maxlength="280" placeholder="What needs doing?" autocomplete="off" required />
          <button type="submit">Add</button>
        </form>
        <div id="error" class="error" role="alert" hidden></div>
      </div>

      <div class="card">
        <ul id="todos"><li class="meta">Loading…</li></ul>
        <div class="meta"><span id="count"></span><button class="ghost" id="refresh" type="button">Refresh</button></div>
      </div>

      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">Storage binding</div>
        <form id="upload">
          <input id="payload" type="text" maxlength="1024" placeholder="Text to store as an object" required />
          <button class="ghost" type="submit">Upload</button>
        </form>
        <p class="note" id="file"></p>
      </div>

      <p class="note">
        This template runs a Lakebed-shaped capsule on shadw's Node lane.
        <code>ctx.db</code> and <code>ctx.storage</code> are one cohesive binding to shadw's
        tenant-scoped storage. See <code>docs/lakebed.md</code> for the honest boundary.
      </p>
    </main>

    <script type="module">
      import { createClient, mount } from "/client/index.mjs";
      mount(createClient(), "browser-demo");
    </script>
  </body>
</html>
